<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ishhen - متجر الخدمات الرقمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #00e5bf; --primary2: #7c3aed; --bg: #030014;
            --card: rgba(12,10,30,0.75); --border: rgba(255,255,255,0.07);
            --danger: #ff3b5c; --warning: #f39c12; --success: #00b894;
            --text: #e0e0e0; --text-secondary: rgba(255,255,255,0.5); --radius: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        
        #cosmos { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3; overflow: hidden; pointer-events: none; }
        .nebula { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.25; animation: drift 25s ease-in-out infinite; }
        .nebula-1 { width: 500px; height: 500px; background: radial-gradient(circle, #7c3aed, transparent); top: -15%; right: -10%; }
        .nebula-2 { width: 400px; height: 400px; background: radial-gradient(circle, #00e5bf, transparent); bottom: 5%; left: -8%; animation-delay: -8s; }
        @keyframes drift { 0%,100%{transform:translate(0,0)scale(1)}25%{transform:translate(40px,-50px)scale(1.1)}50%{transform:translate(-30px,40px)scale(.95)}75%{transform:translate(50px,30px)scale(1.05)} }
        
        #particles-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        
        header { position: sticky; top: 0; z-index: 100; padding: 16px 20px; text-align: center; border-bottom: 1px solid var(--border); background: rgba(3,0,20,0.85); backdrop-filter: blur(30px); }
        .logo { font-family: 'Orbitron'; font-size: 1.8rem; font-weight: 900; background: linear-gradient(135deg,var(--primary),var(--primary2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; letter-spacing: 6px; user-select: none; }
        
        .page { display: none; padding: 16px; max-width: 550px; margin: 0 auto 80px; animation: pageIn .5s ease; }
        .page.active { display: block; }
        @keyframes pageIn { from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)} }
        
        .glass { background: var(--card); backdrop-filter: blur(25px); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        
        .btn { width: 100%; padding: 14px; border-radius: 14px; border: none; background: linear-gradient(135deg,var(--primary),var(--primary2)); color: #000; font-family: 'Cairo'; font-weight: 900; font-size: 1rem; cursor: pointer; margin-top: 8px; transition: .3s; }
        .btn:active { transform: scale(.97); }
        .btn-sm { width: auto; padding: 8px 14px; font-size: .8rem; display: inline-block; }
        
        .cyber-input { width: 100%; padding: 12px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--border); color: #fff; font-family: 'Cairo'; font-size: .9rem; margin-bottom: 10px; outline: none; }
        .cyber-input:focus { border-color: var(--primary); }
        label { display: block; margin-bottom: 4px; color: var(--text-secondary); font-size: .8rem; }
        
        .cat-card { padding: 24px 10px; border-radius: var(--radius); text-align: center; cursor: pointer; border: 1px solid var(--border); background: var(--card); transition: .3s; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .cat-card:hover { transform: translateY(-4px); border-color: var(--primary); }
        .cat-card i { font-size: 2rem; margin-bottom: 8px; }
        .cat-card h3 { font-size: .85rem; font-weight: 700; }
        
        .pkg-card { padding: 14px 16px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; cursor: pointer; border: 1px solid var(--border); transition: .3s; }
        .pkg-card:hover { border-color: var(--primary); background: rgba(0,229,191,.05); }
        .pkg-price { font-family: 'Orbitron'; color: var(--primary); font-weight: 700; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.9); z-index: 999; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #1a1a2e; padding: 30px; border-radius: 24px; max-width: 380px; width: 100%; text-align: center; border: 1px solid var(--primary); animation: modalPop .4s ease; }
        @keyframes modalPop { from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1} }
        
        .admin-tabs { display: flex; gap: 4px; margin-bottom: 14px; overflow-x: auto; }
        .admin-tab { padding: 8px 14px; border-radius: 20px; background: rgba(255,255,255,.03); border: 1px solid var(--border); cursor: pointer; font-size: .78rem; white-space: nowrap; font-weight: 700; }
        .admin-tab.active { background: var(--primary); color: #000; }
        .admin-tab-content { display: none; }
        .admin-tab-content.active { display: block; }
        
        .stat-card { background: rgba(255,255,255,.03); border-radius: 16px; padding: 16px; text-align: center; border: 1px solid var(--border); }
        .stat-value { font-family: 'Orbitron'; font-size: 1.6rem; font-weight: 900; color: var(--primary); }
        .stat-label { font-size: .7rem; color: var(--text-secondary); margin-top: 4px; }
        
        .whatsapp-btn { position: fixed; bottom: 20px; left: 20px; width: 50px; height: 50px; border-radius: 50%; background: #25D366; color: #fff; display: none; align-items: center; justify-content: center; font-size: 1.4rem; z-index: 100; text-decoration: none; animation: waFloat 3s ease-in-out infinite; }
        .whatsapp-btn.visible { display: flex; }
        @keyframes waFloat { 0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)} }
        
        .status-badge { display: inline-block; padding: 3px 10px; border-radius: 15px; font-size: .7rem; font-weight: 800; }
        .badge-pending { background: rgba(243,156,18,.15); color: #f39c12; }
        .badge-approved { background: rgba(0,229,191,.15); color: #00e5bf; }
        .badge-rejected { background: rgba(255,59,92,.15); color: #ff3b5c; }
        
        @media(max-width:380px){.grid2{gap:8px}.cat-card{padding:18px 6px;min-height:100px}.cat-card i{font-size:1.5rem}.cat-card h3{font-size:.75rem}}
    </style>
</head>
<body>
    <div id="cosmos"><div class="nebula nebula-1"></div><div class="nebula nebula-2"></div></div>
    <canvas id="particles-canvas"></canvas>
    <a id="whatsapp-btn" class="whatsapp-btn" href="#" target="_blank"><i class="fab fa-whatsapp"></i></a>

    <header><div class="logo" id="main-logo">ISHHEN</div></header>

    <!-- الصفحة الرئيسية -->
    <div id="page-home" class="page active">
        <div style="text-align:center;margin-bottom:16px">
            <h2 style="font-family:'Orbitron';background:linear-gradient(90deg,var(--primary),#fff,var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent">مرحباً بك</h2>
        </div>
        <div class="grid2" id="categories-grid"><p style="text-align:center;color:#888;grid-column:1/-1">⏳ جاري تحميل الفئات...</p></div>
    </div>

    <!-- صفحة المنتجات -->
    <div id="page-products" class="page">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h2 id="products-title" style="color:var(--primary)"></h2>
            <button class="btn btn-sm" onclick="navigate('home')">🔙 رجوع</button>
        </div>
        <div id="products-list"></div>
    </div>

    <!-- صفحة الباقات -->
    <div id="page-plans" class="page">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h2 id="plans-title" style="color:var(--primary)"></h2>
            <button class="btn btn-sm" onclick="navigate('products')">🔙 رجوع</button>
        </div>
        <div id="plans-list"></div>
    </div>

    <!-- صفحة الدفع -->
    <div id="page-checkout" class="page">
        <h2 style="color:var(--primary);margin-bottom:12px">💳 الدفع</h2>
        <div class="glass">
            <div id="summary-plan" style="font-weight:700"></div>
            <div id="summary-price" style="font-family:'Orbitron';color:var(--primary);font-weight:900;font-size:1.2rem;margin-top:8px"></div>
        </div>
        <div class="glass">
            <label>👤 الآيدي أو الحساب</label>
            <input type="text" id="player-id" class="cyber-input" placeholder="أدخل الآيدي...">
            <label>🧾 رقم عملية الدفع</label>
            <input type="text" id="tx-num" class="cyber-input" placeholder="أدخل رقم التحويل...">
        </div>
        <div class="glass">
            <label style="font-weight:700;color:var(--primary)">💳 طريقة الدفع</label>
            <div id="payment-methods-list"></div>
        </div>
        <button class="btn" onclick="submitOrder()">🚀 تأكيد الطلب</button>
    </div>

    <!-- لوحة التحكم -->
    <div id="page-admin" class="page">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h2 style="color:var(--primary)">👑 لوحة التحكم</h2>
            <button class="btn btn-sm" onclick="adminLogout()" style="background:var(--danger)">🚪 خروج</button>
        </div>
        <div class="admin-tabs">
            <div class="admin-tab active" onclick="switchAdminTab('dashboard')">📊 الرئيسية</div>
            <div class="admin-tab" onclick="switchAdminTab('orders')">📋 الطلبات</div>
            <div class="admin-tab" onclick="switchAdminTab('settings')">⚙️ الإعدادات</div>
            <div class="admin-tab" onclick="switchAdminTab('payments')">💳 الدفع</div>
            <div class="admin-tab" onclick="switchAdminTab('diagnose')">🔍 تشخيص</div>
        </div>
        <div id="tab-dashboard" class="admin-tab-content active">
            <div class="grid2" style="margin-bottom:12px">
                <div class="stat-card"><div class="stat-value" id="stat-products">-</div><div class="stat-label">منتج</div></div>
                <div class="stat-card"><div class="stat-value" id="stat-balance">-</div><div class="stat-label">ل.س</div></div>
            </div>
            <button class="btn btn-sm" onclick="refreshProducts()">🔄 تحديث المنتجات</button>
        </div>
        <div id="tab-orders" class="admin-tab-content"><div id="admin-orders-list"></div></div>
        <div id="tab-settings" class="admin-tab-content">
            <div class="glass"><label>📈 نسبة الربح (%)</label><input type="number" id="set-margin" class="cyber-input" value="20"><button class="btn btn-sm" onclick="saveSetting('margin')">💾 حفظ</button></div>
            <div class="glass"><label>🎉 نسبة الخصم (%)</label><input type="number" id="set-discount" class="cyber-input" value="0"><button class="btn btn-sm" onclick="saveSetting('discount')">💾 حفظ</button></div>
            <div class="glass"><label>💬 رابط واتساب</label><input type="text" id="set-whatsapp" class="cyber-input"><button class="btn btn-sm" onclick="saveSetting('whatsapp')">💾 حفظ</button></div>
        </div>
        <div id="tab-payments" class="admin-tab-content">
            <div class="glass">
                <label>➕ اسم الطريقة</label><input type="text" id="new-pay-name" class="cyber-input" placeholder="سيرياتيل كاش">
                <label>الرقم</label><input type="text" id="new-pay-details" class="cyber-input" placeholder="099xxxxxxxx">
                <button class="btn btn-sm" onclick="addPaymentMethod()">➕ إضافة</button>
            </div>
            <div id="admin-payments-list"></div>
        </div>
        <div id="tab-diagnose" class="admin-tab-content">
            <button class="btn btn-sm" onclick="testAPIConnection()" style="margin:4px">🔍 اختبار الاتصال</button>
            <button class="btn btn-sm" onclick="discoverCategories()" style="margin:4px">📋 اكتشاف الفئات</button>
            <div id="diagnose-result" style="margin-top:10px;font-size:.75rem;max-height:400px;overflow-y:auto"></div>
        </div>
    </div>

    <!-- نافذة التنبيهات -->
    <div id="modal-alert" class="modal">
        <div class="modal-content">
            <div style="font-size:3rem;margin-bottom:10px" id="modal-icon">🎉</div>
            <p style="margin-bottom:16px" id="modal-msg"></p>
            <button class="btn" onclick="closeModal('modal-alert')">حسناً</button>
        </div>
    </div>

    <script>
    // ==================== الإعدادات ====================
    const SYRISTORE_API_KEY = "SDpoC/9YxijfEyiSz0Tm8zNmWTdlNE1lUkk4SU5iS2c9PQ==";
    const SYRISTORE_URLS = ["https://syristore.com/api.php", "https://syristore.com/api", "https://syristore.com/index.php"];
    const ADMIN_PASSWORD = "admin123";
    
    // ==================== المتغيرات ====================
    let allCategories = [], allProducts = [], currentProduct = null;
    let selectedPlan = {}, paymentMethods = [];
    let isAdmin = false, navHistory = ['home'];
    let profitMargin = 20, discountPercent = 0;
    let logoTapCount = 0, logoTapTimer = null;
    let workingUrl = null;

    // ==================== دوال API ====================
    async function syristoreAPI(action, extraData = {}) {
        const payload = { action, ...extraData };
        const headers = { "apikey": SYRISTORE_API_KEY };
        
        // استخدام الرابط العامل إذا وجد
        const urls = workingUrl ? [workingUrl, ...SYRISTORE_URLS] : SYRISTORE_URLS;
        
        for (const url of urls) {
            for (const method of ["POST", "GET"]) {
                try {
                    const response = method === "POST" 
                        ? await fetch(url, { method: "POST", headers: { ...headers, "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams(payload) })
                        : await fetch(url + "?" + new URLSearchParams(payload), { headers });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data && typeof data === "object" && data.status !== "error") {
                            workingUrl = url; // حفظ الرابط العامل
                            return data;
                        }
                        if (data && (data.balance || data.products || data.categories)) {
                            workingUrl = url;
                            return data;
                        }
                    }
                } catch (e) { continue; }
            }
        }
        return null;
    }

    // ==================== التنقل ====================
    function navigate(page) {
        if (page === 'admin' && !isAdmin) { showAlert('🔐 لا تملك صلاحية', '🔐'); return; }
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const el = document.getElementById('page-' + page);
        if (el) { el.classList.add('active'); navHistory.push(page); }
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (page === 'admin') loadAdminDashboard();
        if (page === 'checkout') loadPaymentMethods();
        if (page === 'home') loadAllCategories();
    }

    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function showAlert(msg, icon) {
        document.getElementById('modal-icon').innerText = icon || '🎉';
        document.getElementById('modal-msg').innerText = msg;
        showModal('modal-alert');
    }

    // ==================== نظام الدخول السريع ====================
    document.getElementById('main-logo').addEventListener('click', function(e) {
        e.stopPropagation();
        logoTapCount++;
        clearTimeout(logoTapTimer);
        if (logoTapCount >= 5) {
            logoTapCount = 0;
            if (isAdmin) { adminLogout(); }
            else {
                const pw = prompt('🔐 كلمة المرور:');
                if (pw === ADMIN_PASSWORD) { isAdmin = true; navigate('admin'); showAlert('✅ مرحباً 👑', '👑'); }
                else if (pw) { showAlert('❌ خطأ', '🔐'); }
            }
        }
        logoTapTimer = setTimeout(() => logoTapCount = 0, 1500);
    });

    function adminLogout() { isAdmin = false; navigate('home'); showAlert('👋 تم الخروج', '👋'); }

    // ==================== تحميل الفئات ====================
    async function loadAllCategories() {
        const grid = document.getElementById('categories-grid');
        grid.innerHTML = '<p style="text-align:center;color:#888;grid-column:1/-1">⏳ جاري تحميل الفئات...</p>';
        
        // محاولة جلب الفئات
        let categories = [];
        const catResult = await syristoreAPI("categories");
        
        if (catResult && catResult.categories) {
            categories = catResult.categories;
        } else {
            // استخراج الفئات من المنتجات
            const prodResult = await syristoreAPI("products");
            if (prodResult && prodResult.products) {
                const cats = new Set();
                prodResult.products.forEach(p => {
                    const name = p.name || "";
                    const firstWord = name.split(" ")[0];
                    if (firstWord) cats.add(firstWord);
                });
                categories = [...cats];
            }
        }
        
        allCategories = categories.map((cat, i) => ({
            api_name: typeof cat === "object" ? (cat.id || cat.name || String(cat)) : String(cat),
            display_name: getDisplayName(typeof cat === "object" ? (cat.name || String(cat)) : String(cat)),
            icon: getIcon(i),
            color: getColor(i)
        }));
        
        renderCategories();
    }

    function getDisplayName(name) {
        const t = { game: "🎮 ألعاب", chat: "💬 دردشة", balance: "💰 رصيد", card: "💳 بطاقات", crypto: "₿ عملات", social: "📱 سوشل", number: "📞 أرقام", account: "👤 حسابات", vpn: "🛡️ VPN", telegram: "📲 تيليجرام", special: "🔥 عروض" };
        for (const [k, v] of Object.entries(t)) { if (name.toLowerCase().includes(k)) return v; }
        return "📦 " + name;
    }

    function getIcon(i) {
        const icons = ["fa-fire", "fa-comments", "fa-gamepad", "fa-wallet", "fa-bitcoin", "fa-credit-card", "fa-phone", "fa-user-check", "fa-share-alt", "fa-shield-alt", "fa-telegram"];
        return icons[i % icons.length];
    }

    function getColor(i) {
        const colors = ["#ff6b6b", "#0984e3", "#00b894", "#fdcb6e", "#f39c12", "#e17055", "#6c5ce7", "#00cec9", "#e84393", "#a29bfe", "#74b9ff"];
        return colors[i % colors.length];
    }

    function renderCategories() {
        const grid = document.getElementById('categories-grid');
        if (!allCategories.length) { grid.innerHTML = '<p style="text-align:center;color:#888;grid-column:1/-1">لا توجد فئات</p>'; return; }
        grid.innerHTML = allCategories.map(cat => 
            `<div class="cat-card" onclick="openCategory('${cat.api_name}', '${cat.display_name}')">
                <i class="fas ${cat.icon}" style="color:${cat.color}"></i>
                <h3>${cat.display_name}</h3>
            </div>`
        ).join('');
    }

    // ==================== المنتجات ====================
    async function openCategory(key, name) {
        document.getElementById('products-title').innerText = name;
        navigate('products');
        await loadProducts(key);
    }

    async function loadProducts(catKey) {
        const div = document.getElementById('products-list');
        div.innerHTML = '<p style="text-align:center;padding:30px;color:#888">⏳ جاري التحميل...</p>';
        
        const result = await syristoreAPI("products", { category: catKey });
        
        if (!result || !result.products || !result.products.length) {
            div.innerHTML = '<p style="text-align:center;padding:30px;color:#888">📭 لا توجد منتجات</p>';
            return;
        }
        
        allProducts = result.products.map(p => {
            const plans = (p.plans || []).filter(pl => !pl.disabled).map(pl => ({
                plan_id: pl.planid,
                name: (pl.name || "").replace(/SyriaStore|syriastore/gi, "").trim(),
                price: Math.round(pl.price * (1 + profitMargin / 100) * (1 - discountPercent / 100))
            }));
            return {
                name: (p.name || "").replace(/SyriaStore|syriastore/gi, "").trim(),
                plans
            };
        }).filter(p => p.plans.length > 0);
        
        div.innerHTML = allProducts.map((p, i) => 
            `<div class="pkg-card glass" onclick="selectProduct(${i})">
                <span>📦 ${p.name}</span>
                <span style="color:var(--primary);font-size:.75rem">${p.plans.length} باقة</span>
            </div>`
        ).join('') || '<p style="text-align:center;color:#888">لا توجد منتجات</p>';
    }

    function selectProduct(i) {
        currentProduct = allProducts[i];
        document.getElementById('plans-title').innerText = currentProduct.name;
        document.getElementById('plans-list').innerHTML = currentProduct.plans.map(p => 
            `<div class="pkg-card glass" onclick="selectPlan('${p.plan_id}', '${p.name.replace(/'/g, "\\'")}', ${p.price})">
                <span>${p.name}</span>
                <span class="pkg-price">${p.price.toLocaleString()} ل.س</span>
            </div>`
        ).join('') || '<p style="text-align:center;color:#888">لا توجد باقات</p>';
        navigate('plans');
    }

    function selectPlan(id, name, price) {
        selectedPlan = { id, name, price };
        document.getElementById('summary-plan').innerHTML = `🎯 ${name}<br><small style="color:#888">📦 ${currentProduct.name}</small>`;
        document.getElementById('summary-price').innerText = `💰 ${price.toLocaleString()} ل.س`;
        navigate('checkout');
    }

    // ==================== الدفع ====================
    function loadPaymentMethods() {
        const div = document.getElementById('payment-methods-list');
        const methods = JSON.parse(localStorage.getItem('payment_methods') || '[{"name":"سيرياتيل كاش","details":"0987654321"}]');
        if (!methods.length) { div.innerHTML = '<p style="color:#888">لا توجد طرق دفع</p>'; return; }
        div.innerHTML = methods.map((m, i) => 
            `<div class="pkg-card pay-method-card" onclick="selectPayMethod(${i})" id="pay-method-${i}">
                <span>💳 ${m.name}</span>
                <span style="color:var(--primary);font-size:.8rem">${m.details}</span>
            </div>`
        ).join('');
        if (methods.length > 0) document.getElementById('pay-method-0')?.classList.add('selected');
    }

    function selectPayMethod(i) {
        document.querySelectorAll('.pay-method-card').forEach(c => c.classList.remove('selected'));
        document.getElementById('pay-method-' + i)?.classList.add('selected');
    }

    function submitOrder() {
        const pid = document.getElementById('player-id').value.trim();
        const tx = document.getElementById('tx-num').value.trim();
        if (!pid) { showAlert('⚠️ أدخل الآيدي', '⚠️'); return; }
        if (!tx) { showAlert('⚠️ أدخل رقم العملية', '⚠️'); return; }
        
        // حفظ الطلب محلياً
        const orders = JSON.parse(localStorage.getItem('orders') || '[]');
        orders.unshift({
            order_id: Date.now(),
            plan_name: selectedPlan.name,
            amount_syp: selectedPlan.price,
            player_id: pid,
            tx_num: tx,
            status: 'pending',
            created_at: new Date().toISOString()
        });
        localStorage.setItem('orders', JSON.stringify(orders));
        localStorage.setItem('lastPlayerId', pid);
        showAlert('✅ تم استلام الطلب', '✅');
        navigate('home');
    }

    // ==================== لوحة التحكم ====================
    function switchAdminTab(tab) {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.admin-tab-content').forEach(c => c.classList.remove('active'));
        document.querySelector(`.admin-tab[onclick*="${tab}"]`)?.classList.add('active');
        document.getElementById('tab-' + tab)?.classList.add('active');
        if (tab === 'dashboard') loadAdminDashboard();
        if (tab === 'orders') loadAdminOrders();
        if (tab === 'settings') loadAdminSettings();
        if (tab === 'payments') loadAdminPayments();
    }

    async function loadAdminDashboard() {
        document.getElementById('stat-products').innerText = allProducts.length || '-';
        const result = await syristoreAPI("balance");
        document.getElementById('stat-balance').innerText = result?.balance ? Number(result.balance).toLocaleString() : '-';
        document.getElementById('set-margin').value = profitMargin;
        document.getElementById('set-discount').value = discountPercent;
        document.getElementById('set-whatsapp').value = localStorage.getItem('whatsapp_url') || '';
    }

    function loadAdminOrders() {
        const orders = JSON.parse(localStorage.getItem('orders') || '[]');
        const div = document.getElementById('admin-orders-list');
        if (!orders.length) { div.innerHTML = '<p style="text-align:center;color:#888;padding:20px">📭 لا توجد طلبات</p>'; return; }
        div.innerHTML = orders.map(o => {
            const sc = o.status === 'pending' ? 'badge-pending' : o.status === 'approved' ? 'badge-approved' : 'badge-rejected';
            const st = o.status === 'pending' ? '⏳ قيد المراجعة' : o.status === 'approved' ? '✅ مكتمل' : '❌ مرفوض';
            const btns = o.status === 'pending' ? 
                `<button class="btn btn-sm" style="background:var(--success);margin:2px" onclick="updateOrderStatus(${o.order_id},'approved')">✅</button>
                 <button class="btn btn-sm" style="background:var(--danger);margin:2px" onclick="updateOrderStatus(${o.order_id},'rejected')">❌</button>` : '';
            return `<div class="glass" style="padding:12px">
                <div style="display:flex;justify-content:space-between">
                    <div><b>📦 ${o.plan_name}</b><br><small>👤 ${o.player_id} | 💰 ${Number(o.amount_syp).toLocaleString()} ل.س</small></div>
                    <span class="status-badge ${sc}">${st}</span>
                </div>${btns}</div>`;
        }).join('');
    }

    function updateOrderStatus(id, status) {
        const orders = JSON.parse(localStorage.getItem('orders') || '[]');
        const idx = orders.findIndex(o => o.order_id === id);
        if (idx !== -1) { orders[idx].status = status; localStorage.setItem('orders', JSON.stringify(orders)); }
        loadAdminOrders();
    }

    function loadAdminSettings() {
        document.getElementById('set-margin').value = profitMargin;
        document.getElementById('set-discount').value = discountPercent;
        document.getElementById('set-whatsapp').value = localStorage.getItem('whatsapp_url') || '';
    }

    function saveSetting(type) {
        if (type === 'margin') { profitMargin = parseFloat(document.getElementById('set-margin').value) || 20; }
        else if (type === 'discount') { discountPercent = parseFloat(document.getElementById('set-discount').value) || 0; }
        else if (type === 'whatsapp') {
            const url = document.getElementById('set-whatsapp').value.trim();
            localStorage.setItem('whatsapp_url', url);
            updateWhatsAppBtn(url);
        }
        showAlert('✅ تم الحفظ', '✅');
    }

    function loadAdminPayments() {
        const methods = JSON.parse(localStorage.getItem('payment_methods') || '[{"name":"سيرياتيل كاش","details":"0987654321"}]');
        document.getElementById('admin-payments-list').innerHTML = 
            '<h3 style="color:var(--primary);margin-top:10px">طرق الدفع</h3>' +
            methods.map((m, i) => 
                `<div class="pkg-card"><span>💳 ${m.name} - ${m.details}</span>
                 <button class="btn btn-sm" style="background:var(--danger);width:auto;padding:4px 10px" onclick="deletePayment(${i})">🗑️</button></div>`
            ).join('');
    }

    function addPaymentMethod() {
        const name = document.getElementById('new-pay-name').value.trim();
        const details = document.getElementById('new-pay-details').value.trim();
        if (!name || !details) { showAlert('⚠️ املأ الحقول', '⚠️'); return; }
        const methods = JSON.parse(localStorage.getItem('payment_methods') || '[]');
        methods.push({ name, details });
        localStorage.setItem('payment_methods', JSON.stringify(methods));
        document.getElementById('new-pay-name').value = '';
        document.getElementById('new-pay-details').value = '';
        loadAdminPayments();
        showAlert('✅ تمت الإضافة', '✅');
    }

    function deletePayment(i) {
        if (!confirm('متأكد؟')) return;
        const methods = JSON.parse(localStorage.getItem('payment_methods') || '[]');
        methods.splice(i, 1);
        localStorage.setItem('payment_methods', JSON.stringify(methods));
        loadAdminPayments();
    }

    async function testAPIConnection() {
        const div = document.getElementById('diagnose-result');
        div.innerHTML = '<p style="color:#888">⏳ جاري اختبار الاتصال...</p>';
        
        let report = '<b>🔍 اختبار الاتصال</b>\n\n';
        
        for (const url of SYRISTORE_URLS) {
            report += `📍 ${url}\n`;
            for (const method of ["POST", "GET"]) {
                try {
                    const headers = { "apikey": SYRISTORE_API_KEY };
                    const response = method === "POST"
                        ? await fetch(url, { method: "POST", headers: { ...headers, "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams({ action: "balance" }) })
                        : await fetch(url + "?" + new URLSearchParams({ action: "balance" }), { headers });
                    
                    report += `  ${method}: Status ${response.status}`;
                    if (response.ok) {
                        const data = await response.json();
                        report += ` ✅ ${JSON.stringify(data).substring(0, 100)}\n`;
                        if (data.balance) workingUrl = url;
                    } else {
                        report += ` ❌\n`;
                    }
                } catch (e) {
                    report += `  ${method}: ❌ ${e.message}\n`;
                }
            }
            report += '\n';
        }
        
        div.innerHTML = `<pre style="white-space:pre-wrap;font-size:.7rem;background:rgba(0,0,0,0.3);padding:10px;border-radius:10px">${report}</pre>`;
    }

    async function discoverCategories() {
        const div = document.getElementById('diagnose-result');
        div.innerHTML = '<p style="color:#888">⏳ جاري اكتشاف الفئات...</p>';
        
        let report = '<b>📋 اكتشاف الفئات</b>\n\n';
        
        const catResult = await syristoreAPI("categories");
        if (catResult) {
            report += `<b>✅ استجابة categories:</b>\n${JSON.stringify(catResult, null, 2).substring(0, 1500)}\n\n`;
        }
        
        const prodResult = await syristoreAPI("products");
        if (prodResult?.products) {
            report += `<b>📦 أول 10 منتجات:</b>\n`;
            prodResult.products.slice(0, 10).forEach((p, i) => {
                report += `${i + 1}. ${p.name}\n`;
            });
            
            const cats = new Set();
            prodResult.products.forEach(p => {
                const word = (p.name || "").split(" ")[0];
                if (word) cats.add(word);
            });
            report += `\n<b>📁 الفئات المستخرجة (${cats.size}):</b>\n${[...cats].join('\n')}`;
        }
        
        div.innerHTML = `<pre style="white-space:pre-wrap;font-size:.7rem;background:rgba(0,0,0,0.3);padding:10px;border-radius:10px;max-height:400px;overflow-y:auto">${report}</pre>`;
    }

    function refreshProducts() {
        allProducts = [];
        loadAllCategories();
        showAlert('✅ تم التحديث', '✅');
    }

    function updateWhatsAppBtn(url) {
        const btn = document.getElementById('whatsapp-btn');
        if (url) { btn.href = url; btn.classList.add('visible'); }
        else { btn.classList.remove('visible'); }
    }

    // ==================== جسيمات ====================
    (function() {
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        const particles = [];
        function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
        resize(); addEventListener('resize', resize);
        for (let i = 0; i < 40; i++) particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 2 + 0.5, dx: (Math.random() - 0.5) * 0.4, dy: (Math.random() - 0.5) * 0.4 });
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0,229,191,${Math.random() * 0.2})`; ctx.fill();
                p.x += p.dx; p.y += p.dy;
                if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
            });
            requestAnimationFrame(draw);
        }
        draw();
    })();

    // ==================== بدء التشغيل ====================
    document.addEventListener('DOMContentLoaded', () => {
        loadAllCategories();
        const url = localStorage.getItem('whatsapp_url');
        if (url) updateWhatsAppBtn(url);
        const pid = localStorage.getItem('lastPlayerId');
        if (pid) {
            const el = document.getElementById('player-id');
            if (el) el.value = pid;
        }
    });
    </script>
