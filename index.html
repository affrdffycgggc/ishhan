<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>متجر الليث للشحن 🦁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--text:#f8fafc;--text2:#94a3b8;--gold:#f59e0b;--gold2:#fbbf24;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--radius:16px}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:10px}

.bg-layer{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;opacity:0.15;transition:background-image 1s ease-in-out}

@keyframes pulseTitle{0%,100%{transform:scale(1);text-shadow:0 0 10px var(--gold),0 0 20px var(--gold)}50%{transform:scale(1.05);text-shadow:0 0 20px var(--gold),0 0 40px var(--gold2),0 0 60px var(--gold)}}
@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-10px)}100%{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.app{max-width:500px;margin:0 auto;min-height:100vh;padding-bottom:80px;position:relative}
.page{display:none;padding:16px;animation:slideUp .4s ease}.page.active{display:block}

.header{display:flex;align-items:center;justify-content:space-between;padding:20px 16px;margin-bottom:10px;position:sticky;top:0;background:rgba(15,23,42,0.9);backdrop-filter:blur(15px);z-index:100;border-bottom:2px solid var(--bg2)}
.header-title{font-size:22px;font-weight:900;color:var(--gold);animation:pulseTitle 2s infinite}
.header-actions{display:flex;gap:10px}
.header-btn{width:44px;height:44px;border-radius:12px;background:var(--bg2);border:1px solid var(--bg3);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.header-btn:hover{background:var(--bg3);transform:translateY(-2px)}
.header-btn:active{animation:shake .3s}

.card{background:var(--bg2);border-radius:var(--radius);padding:16px;margin-bottom:16px;border:1px solid var(--bg3);box-shadow:0 4px 15px rgba(0,0,0,0.2)}
.btn{padding:14px 24px;border-radius:12px;border:none;font-weight:700;font-size:16px;cursor:pointer;transition:.2s;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(0.95)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-out{background:transparent;border:1px solid var(--bg3);color:var(--text)}
.input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--bg3);background:var(--bg);color:var(--text);margin-bottom:12px;font-size:15px;outline:none;transition:.2s}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,158,11,0.2)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.prod-card{background:var(--bg2);border-radius:var(--radius);padding:14px;border:1px solid var(--bg3);cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.prod-card:hover{border-color:var(--gold);transform:translateY(-3px)}
.prod-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.prod-name{font-size:14px;font-weight:600;margin-bottom:8px;height:40px;overflow:hidden}
.prod-price{font-size:18px;font-weight:900;color:var(--gold);display:flex;align-items:center;gap:4px}
.prod-price small{font-size:12px;color:var(--text2);font-weight:400}

.order-card{background:var(--bg2);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--bg3)}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-completed{background:rgba(34,197,94,0.15);color:var(--green)}
.badge-failed{background:rgba(239,68,68,0.15);color:var(--red)}
.badge-pending{background:rgba(245,158,11,0.15);color:var(--gold)}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:rgba(30,41,59,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--bg3);display:flex;justify-content:space-around;padding:10px 0;z-index:200}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text2);font-size:11px;cursor:pointer;background:none;border:none;transition:.2s}
.nav-item.active{color:var(--gold)}
.nav-item i{font-size:20px}
.nav-item:active{animation:shake .3s}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:300;padding:16px}
.modal.active{display:flex}
.modal-content{background:var(--bg2);border-radius:var(--radius);padding:20px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;animation:slideUp .3s;border:1px solid var(--gold)}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 20px;background:var(--bg3);color:#fff;border-radius:12px;z-index:400;border:1px solid var(--gold);font-weight:600;display:none;box-shadow:0 0 20px rgba(245,158,11,0.3)}

.admin-tab{padding:10px;background:var(--bg3);border:none;color:var(--text);border-radius:10px;cursor:pointer;font-weight:600}
.admin-tab.active{background:var(--gold);color:#000}
</style>
</head>
<body>
<div class="bg-layer" id="bgLayer"></div>
<div class="app" id="app">
    
    <div class="page active" id="page-auth">
        <div style="text-align:center;padding:40px 0">
            <div style="font-size:80px;animation:float 3s infinite">🦁</div>
            <h1 class="header-title" style="font-size:32px">متجر الليث للشحن</h1>
            <p style="color:var(--text2);margin-top:8px">الأسرع والأفضل بسوريا 🇸🇾</p>
        </div>
        <div class="card">
            <input type="email" id="auth-email" class="input" placeholder="البريد الإلكتروني">
            <input type="password" id="auth-pass" class="input" placeholder="كلمة المرور">
            <button class="btn btn-gold" onclick="doLogin()">دخول 🚀</button>
            <div style="text-align:center;margin:15px 0;color:var(--text2)">أو</div>
            <button class="btn btn-out" onclick="doGoogleLogin()" style="color:#ea4335;border-color:#ea4335">
                <i class="fab fa-google"></i> الدخول عبر غوغل
            </button>
            <button class="btn btn-out" style="margin-top:10px" onclick="showRegister()">إنشاء حساب جديد</button>
        </div>
    </div>

    <div class="page" id="page-home">
        <div class="header">
            <div class="header-title">الليث 🦁</div>
            <div class="header-actions">
                <button class="header-btn" onclick="navigate('notifications')"><i class="fas fa-bell"></i></button>
                <button class="header-btn" onclick="navigate('admin')" id="admin-btn" style="display:none"><i class="fas fa-shield"></i></button>
            </div>
        </div>
        <div class="card" style="text-align:center;background:linear-gradient(135deg,rgba(245,158,11,0.1),rgba(251,191,36,0.1))">
            <h2 style="color:var(--gold)" id="welcome-msg">مرحباً بك في المتجر</h2>
            <p style="color:var(--text2);font-size:13px">اختر القسم المناسب لشحنه</p>
        </div>
        <div id="categories-container" class="grid"></div>
    </div>

    <div class="page" id="page-products">
        <div class="header">
            <button class="header-btn" onclick="navigate('home')"><i class="fas fa-arrow-right"></i></button>
            <div class="header-title" id="cat-title">المنتجات</div>
            <div></div>
        </div>
        <div id="products-container" class="grid"></div>
    </div>

    <div class="page" id="page-detail">
        <div class="header">
            <button class="header-btn" onclick="navigate('products')"><i class="fas fa-arrow-right"></i></button>
            <div class="header-title">تفاصيل الشحن</div>
            <div></div>
        </div>
        <div class="card" id="detail-content"></div>
    </div>

    <div class="page" id="page-orders">
        <div class="header">
            <div class="header-title">طلباتي 📦</div>
        </div>
        <div id="orders-container"></div>
    </div>

    <div class="page" id="page-notifications">
        <div class="header">
            <button class="header-btn" onclick="navigate('home')"><i class="fas fa-arrow-right"></i></button>
            <div class="header-title">الإشعارات 🔔</div>
            <div></div>
        </div>
        <div id="notifs-container"></div>
    </div>

    <div class="page" id="page-admin">
        <div class="header">
            <button class="header-btn" onclick="navigate('home')"><i class="fas fa-arrow-right"></i></button>
            <div class="header-title">إدارة الموقع 👑</div>
            <div></div>
        </div>
        <div class="card" style="text-align:center;background:rgba(168,85,247,0.1);border-color:var(--purple, #a855f7)">
            <p>لوحة تحكم الدعم الفني والشحن موجودة الآن في بوت التلجرام.</p>
            <button class="btn btn-gold" style="margin-top:10px" onclick="window.open('https://t.me/your_bot_username?start=admin', '_blank')">فتح بوت الدعم</button>
        </div>
        <div class="card" style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="admin-tab active" onclick="adminTab('stats', this)">إحصائيات</button>
            <button class="admin-tab" onclick="adminTab('settings', this)">إعدادات الموقع</button>
            <button class="admin-tab" onclick="adminTab('bg', this)">الخلفيات</button>
        </div>
        <div id="admin-content" style="margin-top:16px"></div>
    </div>

</div>

<div class="bottom-nav" id="bottom-nav" style="display:none">
    <button class="nav-item active" onclick="navigate('home')" data-page="home"><i class="fas fa-home"></i>الرئيسية</button>
    <button class="nav-item" onclick="navigate('orders')" data-page="orders"><i class="fas fa-box"></i>طلباتي</button>
    <button class="nav-item" onclick="navigate('notifications')" data-page="notifications"><i class="fas fa-bell"></i>الإشعارات</button>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-content" id="modal-content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// ضع هنا رابط الـ Ngrok أو رابط السيرفر الخاص بك
const API_BASE = 'https://unbegrudged-direfully-nu.ngrok-free.dev';
// ═══════════════════════════════════════════════════════════════

let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq=440, dur=50) {
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq; osc.type = 'sine';
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    osc.start(); osc.stop(audioCtx.currentTime + dur/1000);
}

let token = localStorage.getItem('aliath_token') || '';
let currentCat = null;
let currentProduct = null;

async function api(url, opts={}) {
    const headers = {'Content-Type': 'application/json', ...(opts.headers||{})};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    try {
        const res = await fetch(API_BASE + url, {...opts, headers});
        const data = await res.json();
        if (!data.ok && data.error === 'غير مصرح') { localStorage.removeItem('aliath_token'); location.reload(); }
        return data;
    } catch(e) { return {ok: false, error: 'Network error: ' + e.message}; }
}

function toast(msg, type='info') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    playSound(600); 
    setTimeout(() => t.style.display = 'none', 3000);
}

function navigate(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
    playSound(800, 20);
    
    if (page === 'home') loadCategories();
    if (page === 'orders') loadOrders();
    if (page === 'notifications') loadNotifs();
    if (page === 'admin') loadAdmin('stats');
}

function showRegister() {
    document.getElementById('modal-content').innerHTML = `
        <h2 style="color:var(--gold);margin-bottom:15px">حساب جديد</h2>
        <input type="text" id="reg-name" class="input" placeholder="الاسم الكامل">
        <input type="email" id="reg-email" class="input" placeholder="البريد">
        <input type="password" id="reg-pass" class="input" placeholder="كلمة المرور">
        <input type="text" id="reg-code" class="input" placeholder="كود المدير (اختياري)">
        <button class="btn btn-gold" onclick="doRegister()">تسجيل</button>
    `;
    document.getElementById('modal').classList.add('active');
}

async function doLogin() {
    const email = document.getElementById('auth-email').value;
    const pass = document.getElementById('auth-pass').value;
    const res = await api('/api/auth/login', {method:'POST', body:JSON.stringify({email, password:pass})});
    if (res.ok) { token = res.token; localStorage.setItem('aliath_token', token); initApp(); }
    else toast(res.error);
}

async function doGoogleLogin() {
    const email = prompt("أدخل بريدك لمحاكاة دخول غوغل:", "user@gmail.com");
    if (!email) return;
    const res = await api('/api/auth/google', {method:'POST', body:JSON.stringify({email, name:'مستخدم غوغل'})});
    if (res.ok) { token = res.token; localStorage.setItem('aliath_token', token); initApp(); }
}

async function doRegister() {
    const data = {
        name: document.getElementById('reg-name').value,
        email: document.getElementById('reg-email').value,
        password: document.getElementById('reg-pass').value,
        adminCode: document.getElementById('reg-code').value
    };
    const res = await api('/api/auth/register', {method:'POST', body:JSON.stringify(data)});
    if (res.ok) { token = res.token; localStorage.setItem('aliath_token', token); closeModal(); initApp(); }
    else toast(res.error);
}

async function initApp() {
    document.getElementById('page-auth').classList.remove('active');
    document.getElementById('page-home').classList.add('active');
    document.getElementById('bottom-nav').style.display = 'flex';
    
    const setRes = await api('/api/settings');
    if (setRes.ok) {
        document.getElementById('bgLayer').style.backgroundImage = `url('${setRes.settings.bgImage}')`;
        document.getElementById('welcome-msg').innerText = setRes.settings.slogan;
    }
    
    const meRes = await api('/api/me');
    if (meRes.ok && meRes.user.role === 'admin') {
        document.getElementById('admin-btn').style.display = 'flex';
    }
    
    loadCategories();
}

async function loadCategories() {
    const res = await api('/api/categories');
    const el = document.getElementById('categories-container');
    if (res.ok && res.categories.length) {
        el.innerHTML = res.categories.map(c => `
            <div class="prod-card" onclick="loadProducts(${c.id}, '${c.name}')">
                <div style="font-size:30px;margin-bottom:10px">🎮</div>
                <div class="prod-name">${c.name}</div>
                <div style="font-size:12px;color:var(--text2)">${c.product_count} خطة</div>
            </div>
        `).join('');
    } else { el.innerHTML = '<p style="color:var(--text2)">لا توجد أقسام أو فشل الاتصال بالخادم</p>'; }
}

async function loadProducts(catId, catName) {
    currentCat = catId;
    document.getElementById('cat-title').innerText = catName;
    navigate('products');
    const res = await api('/api/products?cat_id=' + catId);
    const el = document.getElementById('products-container');
    if (res.ok && res.products.length) {
        el.innerHTML = res.products.map(p => `
            <div class="prod-card" onclick="showProductDetail(${p.id})">
                <div class="prod-name">${p.name}</div>
                <div class="prod-price">${p.price_syp.toLocaleString()} <small>ل.س</small></div>
            </div>
        `).join('');
    }
}

async function showProductDetail(pid) {
    const res = await api('/api/products?cat_id=' + currentCat);
    const p = res.products.find(x => x.id == pid);
    if (!p) return;
    currentProduct = p;
    
    let fieldsHtml = '';
    if (p.fields && p.fields.length) {
        fieldsHtml = p.fields.map(f => `<input type="text" id="field-${f}" class="input" placeholder="${f}">`).join('');
    }
    
    document.getElementById('detail-content').innerHTML = `
        <h2 style="color:var(--gold);margin-bottom:10px">${p.name}</h2>
        <div class="prod-price" style="font-size:28px;margin-bottom:20px">${p.price_syp.toLocaleString()} <small>ل.س</small></div>
        ${fieldsHtml}
        <button class="btn btn-green" onclick="placeOrder()">شراء وتأكيد 🚀</button>
    `;
    navigate('detail');
}

async function placeOrder() {
    if (!currentProduct) return;
    const args = [];
    if (currentProduct.fields) {
        for (const f of currentProduct.fields) {
            const val = document.getElementById('field-' + f).value;
            if (!val) return toast(`يرجى ملء حقل ${f}`);
            args.push(val);
        }
    }
    
    const res = await api('/api/order/create', {method:'POST', body:JSON.stringify({product_id: currentProduct.id, args})});
    if (res.ok) {
        document.getElementById('detail-content').innerHTML = `
            <div style="text-align:center;padding:20px">
                <i class="fas fa-check-circle" style="font-size:60px;color:var(--green);margin-bottom:15px"></i>
                <h2>تم بنجاح! 🎉</h2>
                <p style="margin:15px 0">الكود الخاص بك:</p>
                <div style="background:var(--bg);padding:15px;border-radius:10px;border:1px solid var(--gold);font-family:monospace;font-size:18px;color:var(--gold)">${res.code || 'سيصلك قريباً'}</div>
                <button class="btn btn-gold" style="margin-top:15px" onclick="navigate('orders')">طلباتي</button>
            </div>
        `;
        playSound(880, 100);
    } else {
        toast(res.error || 'فشل الطلب');
    }
}

async function loadOrders() {
    const res = await api('/api/orders');
    const el = document.getElementById('orders-container');
    if (res.ok && res.orders.length) {
        el.innerHTML = res.orders.map(o => `
            <div class="order-card">
                <div style="display:flex;justify-content:space-between;margin-bottom:8px">
                    <span style="font-weight:700">#${o.id}</span>
                    <span class="badge badge-${o.status}">${o.status}</span>
                </div>
                <div>${o.product_name}</div>
                <div style="color:var(--gold);margin-top:5px">${o.total_syp.toLocaleString()} ل.س</div>
            </div>
        `).join('');
    } else { el.innerHTML = '<p style="color:var(--text2)">لا توجد طلبات</p>'; }
}

async function loadNotifs() {
    const res = await api('/api/notifications');
    const el = document.getElementById('notifs-container');
    if (res.ok && res.notifications.length) {
        el.innerHTML = res.notifications.map(n => `
            <div class="order-card" style="display:flex;gap:10px;align-items:center">
                <i class="${n.icon}" style="font-size:20px;color:${n.color}"></i>
                <div>${n.message}</div>
            </div>
        `).join('');
    } else { el.innerHTML = '<p style="color:var(--text2)">لا توجد إشعارات</p>'; }
}

function loadAdmin(tab) {
    const el = document.getElementById('admin-content');
    if (tab === 'stats') {
        api('/api/admin/dashboard').then(res => {
            if (res.ok) {
                el.innerHTML = `
                    <div class="grid">
                        <div class="card" style="text-align:center"><h2>${res.stats.total_users}</h2><span>مستخدم</span></div>
                        <div class="card" style="text-align:center"><h2>${res.stats.total_orders}</h2><span>طلب</span></div>
                        <div class="card" style="text-align:center"><h2>${res.stats.completed_orders}</h2><span>مكتمل</span></div>
                        <div class="card" style="text-align:center"><h2>${res.stats.api_balance}$</h2><span>رصيد API</span></div>
                    </div>
                `;
            }
        });
    } else if (tab === 'settings') {
        el.innerHTML = `
            <div class="card">
                <label>سعر الصرف (ل.س / $)</label>
                <input type="number" id="set-rate" class="input" placeholder="14500">
                <label>نسبة الربح (%)</label>
                <input type="number" id="set-margin" class="input" placeholder="10">
                <button class="btn btn-gold" onclick="saveSettings()">حفظ</button>
            </div>
        `;
    } else if (tab === 'bg') {
        el.innerHTML = `
            <div class="card">
                <h3>رفع خلفية جديدة</h3>
                <input type="file" id="bg-file" class="input" accept="image/*">
                <button class="btn btn-gold" onclick="uploadBg()">رفع وتفعيل</button>
            </div>
        `;
    }
}

function adminTab(tab, btn) {
    document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    loadAdmin(tab);
}

async function saveSettings() {
    const rate = document.getElementById('set-rate').value;
    const margin = document.getElementById('set-margin').value;
    const res = await api('/api/admin/settings', {method:'PUT', body:JSON.stringify({exchange_rate:rate, profit_margin:margin})});
    if (res.ok) toast('تم الحفظ ✅');
}

async function uploadBg() {
    const file = document.getElementById('bg-file').files[0];
    if (!file) return toast('اختر صورة');
    const fd = new FormData();
    fd.append('file', file);
    try {
        const res = await fetch(API_BASE + '/api/admin/upload-bg', {method:'POST', headers:{'Authorization':'Bearer '+token}, body:fd});
        const data = await res.json();
        if (data.ok) { document.getElementById('bgLayer').style.backgroundImage = `url('${data.url}')`; toast('تم الرفع ✅'); }
    } catch(e) { toast('خطأ في الرفع'); }
}

function closeModal() { document.getElementById('modal').classList.remove('active'); }

if (token) initApp();
</script>
