<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>متجر الألعاب والبرامج</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick-theme.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary: #6C63FF; --primary-dark: #5A52D5; --secondary: #FF6584; --bg-color: #F4F7F6; --card-bg: #FFFFFF; --text-main: #2D3436; --success: #00B894; --shadow-soft: 0 10px 30px rgba(0,0,0,0.08); --shadow-hover: 0 20px 40px rgba(108, 99, 255, 0.25); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-color); font-family: 'Cairo', sans-serif; direction: rtl; color: var(--text-main); overflow-x: hidden; }
        .contact-bar { background: rgba(45, 52, 54, 0.95); backdrop-filter: blur(10px); color: white; padding: 12px 20px; text-align: center; position: sticky; top: 0; z-index: 1000; }
        .contact-bar a { color: white; margin: 0 15px; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
        .ads-container { max-width: 1200px; margin: 30px auto; padding: 0 20px; border-radius: 25px; overflow: hidden; box-shadow: var(--shadow-soft); }
        .slick-slide img { width: 100%; max-height: 400px; object-fit: cover; }

        .section-card, .product-card {
            background-color: var(--card-bg); border-radius: 20px; overflow: hidden; cursor: pointer;
            transition: transform 0.4s, box-shadow 0.4s; margin-bottom: 30px; box-shadow: var(--shadow-soft); text-align: center; border: none; position: relative;
            min-height: 280px; display: flex; flex-direction: column; justify-content: flex-end;
            background-size: cover !important; background-position: center !important; background-repeat: no-repeat !important;
        }
        .card-bg-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.15) 60%, rgba(0,0,0,0) 100%); z-index: 1; transition: background 0.4s; }
        .section-card:hover .card-bg-overlay, .product-card:hover .card-bg-overlay { background: linear-gradient(to top, rgba(108, 99, 255, 0.85) 0%, rgba(108, 99, 255, 0.4) 60%, rgba(0,0,0,0.1) 100%); }
        .section-card:hover, .product-card:hover { box-shadow: var(--shadow-hover); }
        .card-content { padding: 25px 20px; position: relative; z-index: 2; color: white; }
        .card-content h3 { font-size: 1.4rem; font-weight: 800; margin: 0; text-shadow: 0 2px 5px rgba(0,0,0,0.7); }
        .btn-buy { background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); color: white; border: 2px solid rgba(255,255,255,0.8); padding: 10px 25px; border-radius: 50px; font-weight: 700; margin-top: 15px; display: inline-flex; align-items: center; gap: 8px; }
        .btn-buy:hover { background: white; color: var(--primary); }
        
        .no-bg { 
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)) !important; 
            justify-content: center; 
        }
        .no-bg .card-bg-overlay { display: none !important; }
        .no-bg .card-content { color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .no-bg .btn-buy { background: rgba(255,255,255,0.3); border-color: rgba(255,255,255,0.8); color: white; backdrop-filter: blur(5px); }

        .site-bg-overlay { 
            position: fixed; top:0; left:0; width:100%; height:100%; 
            background-size: cover !important; background-position: center !important; z-index: -1; 
            filter: blur(8px) brightness(0.75); transform: scale(1.1); 
        }
        
        .footer { background: #2D3436; color: #636E72; text-align: center; padding: 30px; margin-top: 60px; border-top: 5px solid var(--primary); }
        .page-view { display: none; min-height: 100vh; padding: 20px; opacity: 0; transition: opacity 0.5s; }
        .page-view.active-page { display: block; opacity: 1; }
        .page-header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 20px 25px; border-radius: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .page-header h3 { margin: 0; font-weight: 900; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
        .page-header button { background: rgba(255,255,255,0.2); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .checkout-product-header { 
            min-height: 300px; border-radius: 20px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; 
            background-size: cover !important; background-position: center !important; margin-bottom: 30px; background-color: var(--primary); 
        }
        .checkout-product-header .overlay { position: absolute; top:0; left:0; right:0; bottom:0; background: linear-gradient(to top, rgba(0,0,0,0.7), rgba(108,99,255,0.4)); }
        .checkout-product-header .content { position: relative; z-index: 2; color: white; padding: 20px; }
        .checkout-product-header h2 { font-weight: 900; font-size: 2.5rem; text-shadow: 0 3px 6px rgba(0,0,0,0.7); }

        .variant-card { background: var(--card-bg); border: 2px solid #dfe6e9; border-radius: 20px; padding: 25px; margin-bottom: 20px; cursor: pointer; transition: all 0.3s; display: flex; justify-content: space-between; align-items: center; }
        .variant-card:hover { border-color: var(--primary); }
        .variant-card.selected { border-color: var(--primary); background: linear-gradient(to left, #f0efff, #ffffff); }
        .variant-price { font-size: 1.6rem; font-weight: 900; color: var(--success); }

        .form-control { border-radius: 15px; padding: 15px; border: 2px solid #dfe6e9; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.1); }
        .btn-submit-payment { background: linear-gradient(135deg, var(--success), #00a884); color: white; font-size: 1.3rem; padding: 18px; border-radius: 50px; font-weight: 900; margin-top: 40px; width: 100%; border: none; display: flex; justify-content: center; align-items: center; gap: 10px; }
        
        .payment-method-item { border: 2px solid #dfe6e9; border-radius: 15px; padding: 20px; margin-bottom: 15px; cursor: pointer; background: var(--card-bg); display: flex; justify-content: space-between; align-items: center; }
        .payment-method-item.active { border-color: var(--primary); background: #f8f9ff; }
        
        /* تعديل زر النسخ */
        .wallet-link-btn { 
            background: transparent; color: var(--primary); border: 2px solid var(--primary); padding: 8px 15px; 
            border-radius: 50px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; 
            cursor: pointer; transition: all 0.3s;
        }
        .wallet-link-btn:hover { background: var(--primary); color: white; }
        .wallet-link-btn.copied { background: var(--success); border-color: var(--success); color: white; }

        .stagger-item { opacity: 0; transform: translateY(30px); animation: staggerFadeIn 0.6s ease forwards; }
        @keyframes staggerFadeIn { to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .variant-card, .payment-method-item { flex-direction: column; text-align: center; gap: 15px; } }
    </style>
</head>
<body>

<div id="siteBgOverlay" class="site-bg-overlay"></div>
<div class="contact-bar" id="contactBar"></div>

<div id="mainShopPage" class="page-view active-page">
    <div class="ads-container" id="adsContainer"></div>
    <div class="container mt-4">
        <h2 class="text-center mb-5" style="font-weight: 900;"><i class="fas fa-rocket" style="color: var(--primary);"></i> تصفح الأقسام</h2>
        <div class="row" id="sectionsContainer"><div class="col-12 text-center"><i class="fas fa-spinner fa-pulse fa-3x"></i></div></div>
    </div>
    <div class="footer"><p>جميع الحقوق محفوظة &copy; 2025</p></div>
</div>

<div id="checkoutPage" class="page-view">
    <div class="container" style="max-width: 900px;">
        <div class="page-header">
            <h3><i class="fas fa-credit-card"></i> إتمام الشراء</h3>
            <button onclick="goBackToShop()"><i class="fas fa-arrow-right"></i></button>
        </div>
        <div id="checkoutContent" class="mt-4"></div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.js"></script>

<script>
    const API_BASE = "https://unbegrudged-direfully-nu.ngrok-free.dev"; // ⚠️ ضع رابط ngrok الخاص بك هنا
    const ngrokHeaders = { 'ngrok-skip-browser-warning': '69420' };
    let currentProductData = null; let selectedVariantId = null; let selectedVariantPrice = 0;

    function fixImageUrl(path) {
        if (!path || !path.trim()) return ''; 
        if (path.startsWith('http')) return path;
        return `${API_BASE}/${path}`;
    }

    async function applyBgImage(element, url) {
        if (!url) { element.classList.add('no-bg'); return; }
        try {
            const resp = await fetch(url, { headers: ngrokHeaders });
            if (!resp.ok) throw new Error('Image load failed');
            const blob = await resp.blob();
            const objectUrl = URL.createObjectURL(blob);
            element.style.backgroundImage = `url('${objectUrl}')`;
            element.classList.remove('no-bg');
        } catch(e) {
            element.classList.add('no-bg');
            element.style.backgroundImage = 'none';
        }
    }

    function showPage(pageId) {
        document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active-page'));
        document.getElementById(pageId).classList.add('active-page');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function goBackToShop() { showPage('mainShopPage'); }

    // دالة نسخ رابط المحفظة للحافظة
    window.copyWalletLink = function(element, url) {
        event.stopPropagation(); // منع اختيار طريقة الدفع عند الضغط على زر النسخ
        event.preventDefault();

        if (!url || url === '#') {
            Swal.fire('تنبيه', 'لم يتم تحديد رابط لهذه المحفظة بعد', 'warning');
            return;
        }

        navigator.clipboard.writeText(url).then(() => {
            const originalHTML = element.innerHTML;
            element.innerHTML = '<i class="fas fa-check"></i> تم النسخ';
            element.classList.add('copied');
            
            setTimeout(() => {
                element.innerHTML = originalHTML;
                element.classList.remove('copied');
            }, 2000);
        }).catch(err => {
            Swal.fire('خطأ', 'فشل نسخ الرابط، انسخه يدوياً: ' + url, 'error');
        });
    };

    async function loadSettingsAndContacts() {
        try {
            const resp = await fetch(`${API_BASE}/api/settings`, { headers: ngrokHeaders });
            const data = await resp.json(); 
            let html = '';
            if (data.whatsapp) html += `<a href="https://wa.me/${data.whatsapp}"><i class="fab fa-whatsapp" style="color:#25D366"></i> واتساب</a>`;
            if (data.telegram) html += `<a href="https://t.me/${data.telegram}"><i class="fab fa-telegram" style="color:#0088cc"></i> تلغرام</a>`;
            document.getElementById('contactBar').innerHTML = html || '';
            if (data.bot_background) {
                const bgUrl = fixImageUrl(data.bot_background);
                applyBgImage(document.getElementById('siteBgOverlay'), bgUrl);
            }
        } catch(e) {}
    }

    async function loadAds() {
        try {
            const resp = await fetch(`${API_BASE}/api/ads`, { headers: ngrokHeaders });
            const ads = await resp.json(); const container = document.getElementById('adsContainer');
            if (!ads.length) { container.innerHTML = ''; return; }
            let html = '<div class="ads-slider">';
            ads.forEach(ad => {
                if (ad.type === 'animated') { ad.images.split(',').forEach(img => { html += `<div><a href="${ad.link || '#'}"><img src="${fixImageUrl(img.trim())}" alt="إعلان"></a></div>`; }); } 
                else { html += `<div><a href="${ad.link || '#'}"><img src="${fixImageUrl(ad.images)}" alt="إعلان"></a></div>`; }
            });
            html += '</div>'; container.innerHTML = html;
            $('.ads-slider').slick({ rtl: true, autoplay: true, autoplaySpeed: 3000, dots: true, fade: true });
        } catch(e) {}
    }

    async function loadSections() {
        try {
            const resp = await fetch(`${API_BASE}/api/sections?parent=0`, { headers: ngrokHeaders });
            const sections = await resp.json(); const container = document.getElementById('sectionsContainer');
            let html = '';
            sections.forEach((sec, index) => {
                html += `<div class="col-lg-3 col-md-4 col-sm-6 stagger-item" style="animation-delay: ${index * 0.1}s">
                            <div class="section-card no-bg" id="sec_${sec.id}" onclick="showSection(${sec.id})">
                                <div class="card-bg-overlay"></div>
                                <div class="card-content"><h3>${sec.name}</h3></div>
                            </div></div>`;
            });
            container.innerHTML = html || '<div class="col-12 text-center"><h4>لا توجد أقسام</h4></div>';
            
            sections.forEach(sec => { const bgUrl = fixImageUrl(sec.image); if (bgUrl) applyBgImage(document.getElementById(`sec_${sec.id}`), bgUrl); });
        } catch(e) { document.getElementById('sectionsContainer').innerHTML = '<div class="col-12 text-danger text-center">فشل الاتصال بالسيرفر</div>'; }
    }

    async function showSection(sectionId) {
        try {
            const resp = await fetch(`${API_BASE}/api/sections/${sectionId}`, { headers: ngrokHeaders });
            if (!resp.ok) throw new Error();
            const data = await resp.json();
            let content = `<div class="text-center mb-4"><h4 style="color:var(--primary); font-weight:900;">${data.section.name}</h4></div><div class="row">`;
            let hasItems = false;

            if (data.subs && data.subs.length > 0) {
                hasItems = true;
                data.subs.forEach((sub, index) => {
                    content += `<div class="col-lg-3 col-md-4 col-sm-6 stagger-item" style="animation-delay: ${index * 0.1}s">
                                    <div class="section-card no-bg" id="sub_${sub.id}" onclick="showSection(${sub.id})">
                                        <div class="card-bg-overlay"></div>
                                        <div class="card-content"><h3>${sub.name}</h3></div>
                                    </div></div>`;
                });
            }
            if (data.products && data.products.length) {
                hasItems = true;
                data.products.forEach((prod, index) => {
                    content += `<div class="col-lg-3 col-md-4 col-sm-6 stagger-item" style="animation-delay: ${index * 0.1}s">
                                    <div class="product-card no-bg" id="prod_${prod.id}" onclick="openDirectCheckout(${prod.id})">
                                        <div class="card-bg-overlay"></div>
                                        <div class="card-content">
                                            <h3>${prod.name}</h3>
                                            <button class="btn-buy" onclick="event.stopPropagation(); openDirectCheckout(${prod.id})"><i class="fas fa-bolt"></i> شراء</button>
                                        </div></div></div>`;
                });
            } 
            
            if (!hasItems) { content += `<div class="col-12"><p class="text-center text-muted">لا توجد منتجات بعد.</p></div>`; }
            content += `</div>`;
            
            Swal.fire({ html: content, width: '90%', showConfirmButton: false, showCloseButton: true });

            if (data.subs) data.subs.forEach(sub => { const bgUrl = fixImageUrl(sub.image); if (bgUrl) applyBgImage(document.getElementById(`sub_${sub.id}`), bgUrl); });
            if (data.products) data.products.forEach(prod => { const pBgUrl = fixImageUrl(prod.background_image || prod.images); if (pBgUrl) applyBgImage(document.getElementById(`prod_${prod.id}`), pBgUrl); });

        } catch(e) { Swal.fire('خطأ', 'فشل التحميل', 'error'); }
    }

    async function openDirectCheckout(productId) {
        Swal.close();
        try {
            const resp = await fetch(`${API_BASE}/api/product/${productId}`, { headers: ngrokHeaders });
            if (!resp.ok) throw new Error();
            const product = await resp.json();
            currentProductData = product; selectedVariantId = null; selectedVariantPrice = 0;

            const shippingResp = await fetch(`${API_BASE}/api/shipping`, { headers: ngrokHeaders });
            const shippingMethods = await shippingResp.json();

            let variantsHtml = '';
            if (product.variants && product.variants.length > 0) {
                product.variants.forEach(v => { variantsHtml += `<div class="variant-card" onclick="selectVariant(this, ${v.id}, ${v.price})"><div style="font-weight:700;"><i class="fas fa-gem" style="color:var(--primary);"></i> ${v.name}</div><div class="variant-price">${v.price > 0 ? v.price + ' ل.س' : 'سيحدد'}</div></div>`; });
            } else { variantsHtml = `<div class="alert alert-warning text-center">غير متوفر</div>`; }

            let shippingHtml = '';
            shippingMethods.forEach(m => {
                const walletLink = m.wallet_link || (m.note && m.note.startsWith('http') ? m.note : '');
                // تم تغيير الرابط إلى زر ينسخ للحافظة
                let walletBtnHtml = '';
                if (walletLink) {
                    walletBtnHtml = `<button type="button" class="wallet-link-btn" onclick="copyWalletLink(this, '${walletLink}')">
                                        <i class="fas fa-copy"></i> نسخ رابط المحفظة
                                     </button>`;
                }
                
                shippingHtml += `<div class="payment-method-item" onclick="selectPaymentMethod(this, ${m.id})">
                                    <div><i class="fas fa-wallet" style="color:var(--primary);"></i> <strong>${m.name}</strong></div>
                                    ${walletBtnHtml}
                                 </div>`;
            });

            const pBgUrl = fixImageUrl(product.background_image || product.images);
            const html = `
                <div class="checkout-product-header no-bg" id="checkout_header_img">
                    <div class="overlay"></div><div class="content"><h2>${product.name}</h2><p>${product.description || ''}</p></div>
                </div>
                <h4 class="mb-3" style="border-right:5px solid var(--primary); padding-right:15px;">1. اختر الكمية:</h4>
                ${variantsHtml}
                <div id="checkoutFormSection" style="display:none; opacity:0; transition: opacity 0.5s;">
                    <h4 class="mb-3 mt-5" style="border-right:5px solid var(--success); padding-right:15px;">2. طريقة الدفع:</h4>
                    <div class="mb-4">${shippingHtml}<input type="hidden" id="selectedShippingId" value=""></div>
                    <h4 class="mb-3 mt-5" style="border-right:5px solid var(--secondary); padding-right:15px;">3. بيانات التحويل:</h4>
                    <form id="paymentForm">
                        <label class="form-label" style="font-weight:700;">رقم الجوال *</label><input type="tel" id="buyerPhone" class="form-control mb-3" required placeholder="09xxxxxxxx">
                        <label class="form-label" style="font-weight:700;">رقم العملية *</label><input type="text" id="transactionNumber" class="form-control" required placeholder="رقم التحويل">
                        <button type="submit" class="btn-submit-payment"><i class="fas fa-paper-plane"></i> تأكيد الدفع</button>
                    </form>
                </div>`;
            document.getElementById('checkoutContent').innerHTML = html;
            
            if (pBgUrl) applyBgImage(document.getElementById('checkout_header_img'), pBgUrl);

            showPage('checkoutPage');
            document.getElementById('paymentForm').addEventListener('submit', submitPayment);
        } catch(e) { Swal.fire('خطأ', 'فشل تحميل المنتج', 'error'); }
    }

    window.selectVariant = function(element, vId, vPrice) {
        selectedVariantId = vId; selectedVariantPrice = vPrice;
        document.querySelectorAll('.variant-card').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        const formSection = document.getElementById('checkoutFormSection');
        formSection.style.display = 'block'; setTimeout(() => formSection.style.opacity = '1', 100);
        formSection.scrollIntoView({ behavior: 'smooth' });
    };

    window.selectPaymentMethod = function(element, mId) {
        document.getElementById('selectedShippingId').value = mId;
        document.querySelectorAll('.payment-method-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
    };

    async function submitPayment(e) {
        e.preventDefault();
        if (!document.getElementById('selectedShippingId').value || !selectedVariantId) { Swal.fire('تنبيه', 'اختر الكمية وطريقة الدفع', 'warning'); return; }
        const data = { product_id: currentProductData.id, variant_id: selectedVariantId, shipping_method_id: parseInt(document.getElementById('selectedShippingId').value), buyer_name: "عميل", buyer_phone: document.getElementById('buyerPhone').value.trim(), transaction_number: document.getElementById('transactionNumber').value.trim(), paid_price: selectedVariantPrice };
        const submitBtn = e.target.querySelector('button[type="submit"]'); submitBtn.disabled = true; submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري المعالجة...';
        try {
            const resp = await fetch(`${API_BASE}/api/checkout`, { method: 'POST', headers: { ...ngrokHeaders, 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            const result = await resp.json();
            if (resp.ok) { Swal.fire({ icon: 'success', title: 'تم الاستلام!', text: result.message }).then(() => { goBackToShop(); location.reload(); }); } 
            else { Swal.fire('خطأ', result.error, 'error'); submitBtn.disabled = false; submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> تأكيد الدفع'; }
        } catch(err) { Swal.fire('خطأ', 'خطأ في الاتصال', 'error'); submitBtn.disabled = false; submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> تأكيد الدفع'; }
    }

    window.addEventListener('load', () => { loadSettingsAndContacts(); loadAds(); loadSections(); });
</script>
</body>
</html>
