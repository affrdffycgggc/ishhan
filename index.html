<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishhen - متجر الخدمات الرقمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{--primary:#00e5bf;--primary2:#7c3aed;--bg:#030014;--card:rgba(12,10,30,0.75);--border:rgba(255,255,255,0.07);--danger:#ff3b5c;--success:#00b894;--text:#e0e0e0;--text-secondary:rgba(255,255,255,0.5)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        header{position:sticky;top:0;z-index:100;padding:16px;text-align:center;border-bottom:1px solid var(--border);background:rgba(3,0,20,0.85);backdrop-filter:blur(30px)}
        .logo{font-family:'Orbitron';font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;letter-spacing:6px}
        .page{display:none;padding:16px;max-width:550px;margin:0 auto 80px;animation:pageIn .5s ease}
        .page.active{display:block}
        @keyframes pageIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        .glass{background:var(--card);backdrop-filter:blur(25px);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:12px}
        .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
        .btn{width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#000;font-family:'Cairo';font-weight:900;font-size:1rem;cursor:pointer;margin-top:8px}
        .btn:active{transform:scale(.97)}
        .btn-sm{width:auto;padding:8px 14px;font-size:.8rem;display:inline-block}
        .cyber-input{width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:#fff;font-family:'Cairo';font-size:.9rem;margin-bottom:10px;outline:none}
        .cyber-input:focus{border-color:var(--primary)}
        label{display:block;margin-bottom:4px;color:var(--text-secondary);font-size:.8rem}
        .cat-card{padding:24px 10px;border-radius:20px;text-align:center;cursor:pointer;border:1px solid var(--border);background:var(--card);transition:.3s;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center}
        .cat-card:hover{transform:translateY(-4px);border-color:var(--primary)}
        .cat-card i{font-size:2rem;margin-bottom:8px}
        .cat-card h3{font-size:.85rem;font-weight:700}
        .pkg-card{padding:14px 16px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;cursor:pointer;border:1px solid var(--border);transition:.3s}
        .pkg-card:hover{border-color:var(--primary);background:rgba(0,229,191,.05)}
        .pkg-card.selected{border-color:var(--primary);border-width:2px;background:rgba(0,229,191,.1)}
        .pkg-price{font-family:'Orbitron';color:var(--primary);font-weight:700}
        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);z-index:999;display:none;justify-content:center;align-items:center;padding:20px}
        .modal-content{background:#1a1a2e;padding:30px;border-radius:24px;max-width:400px;width:100%;text-align:center;border:1px solid var(--primary);animation:modalPop .4s ease;max-height:85vh;overflow-y:auto}
        @keyframes modalPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
        .whatsapp-btn{position:fixed;bottom:20px;left:20px;width:50px;height:50px;border-radius:50%;background:#25D366;color:#fff;display:none;align-items:center;justify-content:center;font-size:1.4rem;z-index:100;text-decoration:none;animation:waFloat 3s ease-in-out infinite}
        .whatsapp-btn.visible{display:flex}
        @keyframes waFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
        .loading-spinner{text-align:center;padding:30px;color:#888}
        .loading-spinner i{font-size:2rem;animation:spin 1s linear infinite}
        @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <a id="whatsapp-btn" class="whatsapp-btn" href="#" target="_blank"><i class="fab fa-whatsapp"></i></a>
    <header><div class="logo" id="main-logo">ISHHEN</div></header>

    <div id="page-home" class="page active">
        <div style="text-align:center;margin-bottom:16px">
            <h2 style="font-family:'Orbitron';background:linear-gradient(90deg,var(--primary),#fff,var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent">مرحباً بك</h2>
        </div>
        <div class="grid2" id="categories-grid">
            <div class="loading-spinner" style="grid-column:1/-1"><i class="fas fa-spinner"></i><p>جاري تحميل المنتجات...</p></div>
        </div>
        <!-- قسم التشخيص -->
        <div id="debug-info" style="margin-top:16px;font-size:.75rem;color:#888;text-align:center"></div>
    </div>

    <div id="page-products" class="page">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h2 id="products-title" style="color:var(--primary)"></h2>
            <button class="btn btn-sm" onclick="navigate('home')">🔙 رجوع</button>
        </div>
        <div id="products-list"></div>
    </div>

    <div id="page-plans" class="page">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h2 id="plans-title" style="color:var(--primary)"></h2>
            <button class="btn btn-sm" onclick="navigate('products')">🔙 رجوع</button>
        </div>
        <div id="plans-list"></div>
    </div>

    <div id="page-checkout" class="page">
        <h2 style="color:var(--primary);margin-bottom:12px">💳 الدفع</h2>
        <div class="glass">
            <div id="summary-plan" style="font-weight:700"></div>
            <div id="summary-price" style="font-family:'Orbitron';color:var(--primary);font-weight:900;font-size:1.2rem;margin-top:8px"></div>
        </div>
        <div class="glass">
            <label>👤 الآيدي أو الحساب</label>
            <input type="text" id="player-id" class="cyber-input" placeholder="أدخل الآيدي...">
            <label>🧾 رقم عملية الدفع</label>
            <input type="text" id="tx-num" class="cyber-input" placeholder="أدخل رقم التحويل...">
        </div>
        <div class="glass">
            <label style="font-weight:700;color:var(--primary)">💳 طريقة الدفع</label>
            <div id="payment-methods-list"></div>
        </div>
        <button class="btn" onclick="submitOrder()">🚀 تأكيد الطلب</button>
    </div>

    <div id="modal-alert" class="modal">
        <div class="modal-content">
            <div style="font-size:3rem;margin-bottom:10px" id="modal-icon">🎉</div>
            <p style="margin-bottom:16px" id="modal-msg"></p>
            <button class="btn" onclick="closeModal('modal-alert')">حسناً</button>
        </div>
    </div>

    <div id="modal-admin" class="modal">
        <div class="modal-content" style="max-width:500px;text-align:right">
            <h3 style="color:var(--primary);text-align:center;margin-bottom:16px">👑 لوحة التحكم</h3>
            <div class="glass"><label>📈 نسبة الربح (%)</label><input type="number" id="admin-margin" class="cyber-input" value="20"><button class="btn btn-sm" onclick="saveMargin()">💾 حفظ</button></div>
            <div class="glass"><label>💬 واتساب</label><input type="text" id="admin-whatsapp" class="cyber-input"><button class="btn btn-sm" onclick="saveWhatsApp()">💾 حفظ</button></div>
            <div class="glass"><label>💳 إضافة دفع</label><input type="text" id="pay-name" class="cyber-input" placeholder="الاسم"><input type="text" id="pay-details" class="cyber-input" placeholder="الرقم"><button class="btn btn-sm" onclick="addPayment()">➕</button><div id="payments-list" style="margin-top:8px"></div></div>
            <button class="btn btn-sm" onclick="closeModal('modal-admin')" style="background:var(--danger);width:100%;margin-top:10px">إغلاق</button>
        </div>
    </div>

    <script>
    const API_KEY = "SDpoC/9YxijfEyiSz0Tm8zNmWTdlNE1lUkk4SU5iS2c9PQ==";
    const API_URL = "https://syristore.com/api.php";
    const CORS_PROXY = "https://api.allorigins.win/raw?url=";
    
    let allProducts = [], currentProduct = null, selectedPlan = {}, margin = 20;
    let tapCount = 0, tapTimer = null;

    // ==================== API CALL ====================
    async function callAPI(action, extra = {}) {
        const params = new URLSearchParams({ action, ...extra });
        const url = API_URL + "?" + params.toString();
        const debug = document.getElementById('debug-info');
        
        // طريقة 1: allorigins proxy
        try {
            const proxyUrl = CORS_PROXY + encodeURIComponent(url);
            const r = await fetch(proxyUrl);
            if (r.ok) {
                const text = await r.text();
                try { return JSON.parse(text); } catch(e) { return text; }
            }
        } catch(e) { if(debug) debug.innerText = "allorigins: " + e.message; }
        
        // طريقة 2: corsproxy.io
        try {
            const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(url);
            const r = await fetch(proxyUrl);
            if (r.ok) {
                const text = await r.text();
                try { return JSON.parse(text); } catch(e) { return text; }
            }
        } catch(e) { if(debug) debug.innerText += " | corsproxy: " + e.message; }
        
        // طريقة 3: codetabs
        try {
            const proxyUrl = "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url);
            const r = await fetch(proxyUrl);
            if (r.ok) {
                const text = await r.text();
                try { return JSON.parse(text); } catch(e) { return text; }
            }
        } catch(e) { if(debug) debug.innerText += " | codetabs: " + e.message; }
        
        // طريقة 4: مباشر
        try {
            const r = await fetch(url, { headers: { "apikey": API_KEY }, mode: "cors" });
            if (r.ok) {
                const text = await r.text();
                try { return JSON.parse(text); } catch(e) { return text; }
            }
        } catch(e) { if(debug) debug.innerText += " | direct: " + e.message; }
        
        return null;
    }

    // ==================== تحميل المنتجات ====================
    async function loadAllProducts() {
        const grid = document.getElementById('categories-grid');
        const debug = document.getElementById('debug-info');
        
        debug.innerText = "⏳ جاري الاتصال بـ SyriaStore...";
        
        const result = await callAPI("products");
        
        if (!result) {
            grid.innerHTML = '<p style="text-align:center;color:var(--danger);grid-column:1/-1;padding:20px">❌ فشل الاتصال بجميع الطرق</p>';
            debug.innerText = "❌ فشل الاتصال - تحقق من الانترنت أو جرب لاحقاً";
            return;
        }
        
        debug.innerText = "✅ تم الاتصال! نوع البيانات: " + typeof result;
        
        // عرض البيانات الخام للتشخيص
        console.log("API Response:", result);
        
        let products = [];
        
        if (result.products && Array.isArray(result.products)) {
            products = result.products;
            debug.innerText += " | products: " + products.length;
        } else if (Array.isArray(result)) {
            products = result;
            debug.innerText += " | array: " + products.length;
        } else if (result.data && Array.isArray(result.data)) {
            products = result.data;
            debug.innerText += " | data: " + products.length;
        } else {
            debug.innerText += " | raw: " + JSON.stringify(result).substring(0, 200);
            // محاولة استخراج المنتجات من أي مفتاح
            for (const key in result) {
                if (Array.isArray(result[key]) && result[key].length > 0) {
                    products = result[key];
                    debug.innerText += " | found in key: " + key;
                    break;
                }
            }
        }
        
        if (!products.length) {
            grid.innerHTML = '<p style="text-align:center;color:#888;grid-column:1/-1;padding:20px">📭 لا توجد منتجات متاحة</p>';
            debug.innerText += " | لا توجد منتجات";
            return;
        }
        
        // تنظيف وتصنيف المنتجات
        const categoriesMap = {};
        
        products.forEach(p => {
            const rawName = p.name || p.product_name || p.title || "";
            const cleanName = rawName.replace(/SyriaStore|syriastore|SYRIASTORE/gi, "").trim();
            if (!cleanName) return;
            
            // استخراج الكلمة الأولى كفئة
            const firstWord = cleanName.split(" ")[0];
            const catKey = firstWord.toLowerCase();
            
            if (!categoriesMap[catKey]) {
                categoriesMap[catKey] = {
                    key: catKey,
                    name: getCatDisplayName(firstWord),
                    icon: getIcon(Object.keys(categoriesMap).length),
                    color: getColor(Object.keys(categoriesMap).length),
                    products: []
                };
            }
            
            // تجهيز الباقات
            const plans = (p.plans || []).filter(pl => !pl.disabled).map(pl => ({
                plan_id: pl.planid || pl.id,
                name: (pl.name || "").replace(/SyriaStore|syriastore/gi, "").trim(),
                price: Math.round((pl.price || 0) * (1 + margin / 100))
            }));
            
            if (plans.length > 0) {
                categoriesMap[catKey].products.push({
                    name: cleanName,
                    plans: plans
                });
            }
        });
        
        // حفظ البيانات
        window._categories = Object.values(categoriesMap).filter(c => c.products.length > 0);
        window._allProducts = products;
        
        debug.innerText += " | فئات: " + window._categories.length;
        
        renderCategories();
    }

    function getCatDisplayName(word) {
        const w = word.toLowerCase();
        if (w.includes("pubg") || w.includes("free") || w.includes("game") || w.includes("فري") || w.includes("ببجي") || w.includes("mobile") || w.includes("call") || w.includes("fortnite") || w.includes("clash")) return "🎮 ألعاب";
        if (w.includes("whatsapp") || w.includes("telegram") || w.includes("messenger") || w.includes("chat") || w.includes("واتس") || w.includes("تلي")) return "💬 دردشة";
        if (w.includes("balance") || w.includes("topup") || w.includes("رصيد") || w.includes("شحن") || w.includes("mtc") || w.includes("mtn") || w.includes("syriatel")) return "💰 رصيد";
        if (w.includes("card") || w.includes("gift") || w.includes("بطاقة") || w.includes("itunes") || w.includes("google") || w.includes("steam") || w.includes("netflix")) return "💳 بطاقات";
        if (w.includes("bitcoin") || w.includes("usdt") || w.includes("crypto") || w.includes("عملة") || w.includes("binance")) return "₿ عملات";
        if (w.includes("facebook") || w.includes("instagram") || w.includes("twitter") || w.includes("tiktok") || w.includes("snapchat") || w.includes("youtube") || w.includes("social")) return "📱 سوشل";
        if (w.includes("number") || w.includes("virtual") || w.includes("رقم") || w.includes("otp") || w.includes("sms")) return "📞 أرقام";
        if (w.includes("account") || w.includes("حساب")) return "👤 حسابات";
        if (w.includes("vpn") || w.includes("proxy")) return "🛡️ VPN";
        if (w.includes("special") || w.includes("offer") || w.includes("عرض")) return "🔥 عروض";
        return "📦 " + word;
    }

    function getIcon(i) {
        const icons = ["fa-fire", "fa-comments", "fa-gamepad", "fa-wallet", "fa-bitcoin", "fa-credit-card", "fa-phone", "fa-user-check", "fa-share-alt", "fa-shield-alt", "fa-telegram", "fa-star"];
        return icons[i % icons.length];
    }

    function getColor(i) {
        const colors = ["#ff6b6b", "#0984e3", "#00b894", "#fdcb6e", "#f39c12", "#e17055", "#6c5ce7", "#00cec9", "#e84393", "#a29bfe", "#74b9ff", "#ffd700"];
        return colors[i % colors.length];
    }

    function renderCategories() {
        const grid = document.getElementById('categories-grid');
        const cats = window._categories || [];
        
        if (!cats.length) {
            grid.innerHTML = '<p style="text-align:center;color:#888;grid-column:1/-1">لا توجد فئات</p>';
            return;
        }
        
        grid.innerHTML = cats.map(c =>
            `<div class="cat-card" onclick="showCategoryProducts('${c.key}')">
                <i class="fas ${c.icon}" style="color:${c.color}"></i>
                <h3>${c.name}</h3>
                <small style="color:#888;font-size:.7rem">${c.products.length} منتج</small>
            </div>`
        ).join('');
    }

    function navigate(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + page)?.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (page === 'checkout') loadPaymentMethods();
    }

    function showCategoryProducts(catKey) {
        const cat = (window._categories || []).find(c => c.key === catKey);
        if (!cat) return;
        
        document.getElementById('products-title').innerText = cat.name;
        navigate('products');
        
        allProducts = cat.products;
        document.getElementById('products-list').innerHTML = allProducts.map((p, i) =>
            `<div class="pkg-card glass" onclick="selectProduct(${i})">
                <span>📦 ${p.name}</span>
                <span style="color:var(--primary);font-size:.75rem">${p.plans.length} باقة</span>
            </div>`
        ).join('');
    }

    function selectProduct(i) {
        currentProduct = allProducts[i];
        document.getElementById('plans-title').innerText = currentProduct.name;
        document.getElementById('plans-list').innerHTML = currentProduct.plans.map(p =>
            `<div class="pkg-card glass" onclick="selectPlan('${p.plan_id}', '${p.name.replace(/'/g, "\\'")}', ${p.price})">
                <span>${p.name}</span>
                <span class="pkg-price">${p.price.toLocaleString()} ل.س</span>
            </div>`
        ).join('');
        navigate('plans');
    }

    function selectPlan(id, name, price) {
        selectedPlan = { id, name, price };
        document.getElementById('summary-plan').innerHTML = `🎯 ${name}<br><small style="color:#888">📦 ${currentProduct?.name || ''}</small>`;
        document.getElementById('summary-price').innerText = `💰 ${price.toLocaleString()} ل.س`;
        navigate('checkout');
    }

    function loadPaymentMethods() {
        const methods = JSON.parse(localStorage.getItem('pm') || '[{"name":"سيرياتيل كاش","details":"0987654321"}]');
        const div = document.getElementById('payment-methods-list');
        div.innerHTML = methods.map((m, i) =>
            `<div class="pkg-card" onclick="selectPM(${i})" id="pm-${i}">
                <span>💳 ${m.name}</span><span style="color:var(--primary);font-size:.8rem">${m.details}</span>
            </div>`
        ).join('');
        setTimeout(() => document.getElementById('pm-0')?.classList.add('selected'), 100);
    }

    function selectPM(i) {
        document.querySelectorAll('#payment-methods-list .pkg-card').forEach(c => c.classList.remove('selected'));
        document.getElementById('pm-' + i)?.classList.add('selected');
    }

    function submitOrder() {
        const pid = document.getElementById('player-id').value.trim();
        const tx = document.getElementById('tx-num').value.trim();
        if (!pid) return showAlert('⚠️ أدخل الآيدي', '⚠️');
        if (!tx) return showAlert('⚠️ أدخل رقم العملية', '⚠️');
        localStorage.setItem('pid', pid);
        showAlert('✅ تم استلام الطلب', '✅');
        navigate('home');
    }

    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function showAlert(msg, icon) {
        document.getElementById('modal-icon').innerText = icon || '🎉';
        document.getElementById('modal-msg').innerText = msg;
        showModal('modal-alert');
    }

    // دخول لوحة التحكم
    document.getElementById('main-logo').addEventListener('click', () => {
        tapCount++;
        clearTimeout(tapTimer);
        if (tapCount >= 5) {
            tapCount = 0;
            const pw = prompt('🔐 كلمة المرور:');
            if (pw === 'admin123') {
                document.getElementById('admin-margin').value = margin;
                document.getElementById('admin-whatsapp').value = localStorage.getItem('wa') || '';
                loadAdminPayments();
                showModal('modal-admin');
            } else if (pw) showAlert('❌ خطأ', '🔐');
        }
        tapTimer = setTimeout(() => tapCount = 0, 1500);
    });

    function saveMargin() { margin = parseFloat(document.getElementById('admin-margin').value) || 20; showAlert('✅ تم الحفظ', '✅'); }
    function saveWhatsApp() {
        const u = document.getElementById('admin-whatsapp').value.trim();
        localStorage.setItem('wa', u);
        const b = document.getElementById('whatsapp-btn');
        if (u) { b.href = u; b.classList.add('visible'); } else b.classList.remove('visible');
        showAlert('✅ تم', '✅');
    }
    function loadAdminPayments() {
        const m = JSON.parse(localStorage.getItem('pm') || '[{"name":"سيرياتيل كاش","details":"0987654321"}]');
        document.getElementById('payments-list').innerHTML = m.map((p, i) =>
            `<div class="pkg-card"><span>💳 ${p.name} - ${p.details}</span><button class="btn btn-sm" style="background:var(--danger);width:auto;padding:4px 8px" onclick="delPM(${i})">🗑️</button></div>`
        ).join('');
    }
    function addPayment() {
        const n = document.getElementById('pay-name').value.trim();
        const d = document.getElementById('pay-details').value.trim();
        if (!n || !d) return showAlert('⚠️ املأ الحقول', '⚠️');
        const m = JSON.parse(localStorage.getItem('pm') || '[]');
        m.push({ name: n, details: d });
        localStorage.setItem('pm', JSON.stringify(m));
        document.getElementById('pay-name').value = '';
        document.getElementById('pay-details').value = '';
        loadAdminPayments();
    }
    function delPM(i) { const m = JSON.parse(localStorage.getItem('pm') || '[]'); m.splice(i, 1); localStorage.setItem('pm', JSON.stringify(m)); loadAdminPayments(); }

    // بدء التشغيل
    document.addEventListener('DOMContentLoaded', () => {
        loadAllProducts();
        const wa = localStorage.getItem('wa');
        if (wa) { document.getElementById('whatsapp-btn').href = wa; document.getElementById('whatsapp-btn').classList.add('visible'); }
        const pid = localStorage.getItem('pid');
        if (pid) { const el = document.getElementById('player-id'); if (el) el.value = pid; }
    });
    </script>
</body>
</html>
