<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر الألعاب والبرامج</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick-theme.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- سكربت للتعرف على مستخدم تليغرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #00f2ff; --primary-dark: #00b8c4; --secondary: #bc13fe;
            --bg-color: #0b0c15; --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.1); --text-main: #e0e0e0;
            --text-muted: #8a8f9a; --success: #00ff9d;
            --shadow-glow: 0 0 20px rgba(0, 242, 255, 0.15);
            --shadow-hover: 0 10px 40px rgba(0, 242, 255, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-color); font-family: 'Cairo', sans-serif; direction: rtl; color: var(--text-main); overflow-x: hidden; position: relative; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px); background-size: 50px 50px; z-index: -2; }
        .site-bg-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background-size: cover !important; background-position: center !important; z-index: -1; filter: blur(12px) brightness(0.3) saturate(1.5); transform: scale(1.1); transition: background-image 1s ease; }
        .contact-bar { background: rgba(11, 12, 21, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--card-border); color: white; padding: 15px 20px; text-align: center; position: sticky; top: 0; z-index: 1000; }
        .contact-bar a { color: var(--text-main); margin: 0 15px; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: color 0.3s; }
        .contact-bar a:hover { color: var(--primary); }
        .ads-container { max-width: 1200px; margin: 30px auto; padding: 0 20px; border-radius: 25px; overflow: hidden; box-shadow: var(--shadow-glow); border: 1px solid var(--card-border); }
        .slick-slide img { width: 100%; max-height: 450px; object-fit: cover; border-radius: 20px; }
        
        .text-ad-banner { background: linear-gradient(135deg, var(--secondary), var(--primary-dark)); padding: 0; text-align: center; color: white; min-height: 80px; display: flex; align-items: center; font-size: 1.5rem; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.5); overflow: hidden; position: relative; }
        .text-ad-banner.animated-text { padding: 0; }
        .text-ad-banner.animated-text span { display: inline-block; white-space: nowrap; padding-right: 50px; animation: marquee 10s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .section-card, .product-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 25px; overflow: hidden; cursor: pointer; transition: transform 0.4s, box-shadow 0.4s, border-color 0.4s; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center; position: relative; min-height: 280px; display: flex; flex-direction: column; justify-content: flex-end; background-size: cover !important; background-position: center !important; backdrop-filter: blur(5px); }
        .card-bg-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, rgba(11,12,21,0.95) 0%, rgba(11,12,21,0.4) 60%, rgba(0,0,0,0) 100%); z-index: 1; transition: background 0.4s; }
        .section-card:hover, .product-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: var(--shadow-hover); }
        .section-card:hover .card-bg-overlay, .product-card:hover .card-bg-overlay { background: linear-gradient(to top, rgba(0, 242, 255, 0.4) 0%, rgba(11,12,21,0.2) 100%); }
        .card-content { padding: 25px 20px; position: relative; z-index: 2; color: white; }
        .card-content h3 { font-size: 1.4rem; font-weight: 800; margin: 0; text-shadow: 0 2px 5px rgba(0,0,0,0.7); }
        .btn-buy { background: transparent; color: var(--primary); border: 2px solid var(--primary); padding: 10px 25px; border-radius: 50px; font-weight: 700; margin-top: 15px; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s; }
        .btn-buy:hover { background: var(--primary); color: var(--bg-color); box-shadow: 0 0 20px var(--primary); }
        .no-bg { background: linear-gradient(135deg, rgba(0, 242, 255, 0.1), rgba(188, 19, 254, 0.1)) !important; justify-content: center; border: 1px solid rgba(0, 242, 255, 0.3); }
        .no-bg .card-bg-overlay { display: none !important; }
        .no-bg .card-content { color: white; text-shadow: none; }
        .no-bg .btn-buy { background: rgba(0, 242, 255, 0.1); border-color: var(--primary); color: var(--primary); }
        .footer { background: rgba(11, 12, 21, 0.9); backdrop-filter: blur(10px); color: var(--text-muted); text-align: center; padding: 30px; margin-top: 60px; border-top: 1px solid var(--card-border); }
        .page-view { display: none; min-height: 100vh; padding: 20px; opacity: 0; transition: opacity 0.5s; }
        .page-view.active-page { display: block; opacity: 1; }
        .page-header { background: rgba(11, 12, 21, 0.8); backdrop-filter: blur(20px); border: 1px solid var(--card-border); color: white; padding: 20px 25px; border-radius: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .page-header h3 { margin: 0; font-weight: 900; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; color: var(--primary); }
        .page-header button { background: rgba(255,255,255,0.1); border: 1px solid var(--card-border); color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .page-header button:hover { background: var(--primary); color: var(--bg-color); }
        .checkout-product-header { min-height: 300px; border-radius: 25px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; background-size: cover !important; background-position: center !important; margin-bottom: 30px; background-color: var(--bg-color); border: 1px solid var(--card-border); }
        .checkout-product-header .overlay { position: absolute; top:0; left:0; right:0; bottom:0; background: linear-gradient(to top, rgba(11,12,21,0.9), rgba(0,242,255,0.2)); }
        .checkout-product-header .content { position: relative; z-index: 2; color: white; padding: 20px; }
        .checkout-product-header h2 { font-weight: 900; font-size: 2.5rem; text-shadow: 0 0 20px var(--primary); }
        .variant-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 25px; margin-bottom: 20px; cursor: pointer; transition: all 0.3s; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); }
        .variant-card:hover { border-color: var(--primary); background: rgba(0, 242, 255, 0.05); }
        .variant-card.selected { border-color: var(--primary); background: rgba(0, 242, 255, 0.1); box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }
        .variant-card.disabled-card { opacity: 0.4; cursor: not-allowed; border-color: var(--secondary); }
        .variant-card.disabled-card:hover { background: var(--card-bg); border-color: var(--secondary); }
        .variant-price { font-size: 1.6rem; font-weight: 900; color: var(--success); text-shadow: 0 0 10px rgba(0, 255, 157, 0.3); }
        .form-control { background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); border-radius: 15px; padding: 15px; color: white; }
        .form-control:focus { background: rgba(255,255,255,0.08); border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0, 242, 255, 0.1); color: white; }
        .form-control::placeholder { color: var(--text-muted); }
        .btn-submit-payment { background: linear-gradient(135deg, var(--success), #00b87a); color: var(--bg-color); font-size: 1.3rem; padding: 18px; border-radius: 50px; font-weight: 900; margin-top: 40px; width: 100%; border: none; display: flex; justify-content: center; align-items: center; gap: 10px; transition: all 0.3s; box-shadow: 0 0 20px rgba(0, 255, 157, 0.3); }
        .btn-submit-payment:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 255, 157, 0.5); }
        .payment-method-item { border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; margin-bottom: 15px; cursor: pointer; background: var(--card-bg); display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); transition: 0.3s; }
        .payment-method-item.active { border-color: var(--primary); background: rgba(0, 242, 255, 0.1); }
        .wallet-link-btn { background: transparent; color: var(--primary); border: 1px solid var(--primary); padding: 8px 15px; border-radius: 50px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; transition: all 0.3s; }
        .wallet-link-btn:hover { background: var(--primary); color: var(--bg-color); }
        .wallet-link-btn.copied { background: var(--success); border-color: var(--success); color: var(--bg-color); }
        .qr-code-img { max-width: 90px; border-radius: 10px; border: 2px solid var(--card-border); margin-left: 15px; }
        .stagger-item { opacity: 0; transform: translateY(30px); animation: staggerFadeIn 0.6s ease forwards; }
        @keyframes staggerFadeIn { to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .variant-card, .payment-method-item { flex-direction: column; text-align: center; gap: 15px; } .checkout-product-header h2 { font-size: 1.8rem; } }
        .swal2-popup { background: rgba(11, 12, 21, 0.95) !important; border: 1px solid var(--card-border) !important; color: var(--text-main) !important; border-radius: 25px !important; }
        .swal2-close { color: var(--text-main) !important; }
        .order-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 15px; padding: 15px; margin-bottom: 15px; text-align: right; }
        .status-pending { color: #ffc107; font-weight: bold; } .status-verified { color: #00ff9d; font-weight: bold; } .status-rejected { color: #ff4d4d; font-weight: bold; }
    </style>
</head>
<body>

<div id="siteBgOverlay" class="site-bg-overlay"></div>
<div class="contact-bar" id="contactBar"></div>

<div id="mainShopPage" class="page-view active-page">
    <div class="ads-container" id="adsContainer"></div>
    <div class="container mt-4">
        <h2 class="text-center mb-5" style="font-weight: 900; color: var(--primary); text-shadow: 0 0 20px rgba(0,242,255,0.3);"><i class="fas fa-rocket"></i> تصفح الأقسام</h2>
        <div class="row" id="sectionsContainer"><div class="col-12 text-center"><i class="fas fa-spinner fa-pulse fa-3x" style="color: var(--primary);"></i></div></div>
    </div>
    <div class="footer"><p>جميع الحقوق محفوظة &copy; 2025</p></div>
</div>

<div id="checkoutPage" class="page-view">
    <div class="container" style="max-width: 900px;">
        <div class="page-header">
            <h3><i class="fas fa-credit-card"></i> إتمام الشراء</h3>
            <button onclick="goBackToShop()"><i class="fas fa-arrow-right"></i></button>
        </div>
        <div id="checkoutContent" class="mt-4"></div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.js"></script>

<script>
    const API_BASE = "https://unbegrudged-direfully-nu.ngrok-free.dev"; 
    const ngrokHeaders = { 'ngrok-skip-browser-warning': '69420' };
    let currentProductData = null; let selectedVariantId = null; let selectedVariantPrice = 0;

    // ===== نظام إنشاء الحساب التلقائي =====
    function getBuyerId() {
        // 1. التحقق مما إذا كان المستخدم يتصفح من داخل تليغرام
        if (window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
            return 'tg_' + Telegram.WebApp.initDataUnsafe.user.id;
        }
        // 2. إذا كان يتصفح من المتصفح العادي، ننشئ معرف ونخزنه محلياً
        let deviceId = localStorage.getItem('shop_device_id');
        if (!deviceId) {
            deviceId = 'web_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('shop_device_id', deviceId);
        }
        return deviceId;
    }

    const BUYER_ID = getBuyerId(); // معرف المستخدم الحالي

    const imageUrlCache = {}; 
    function fixImageUrl(path) {
        if (!path || !path.trim()) return ''; 
        if (path.startsWith('http')) return path;
        return `${API_BASE}/${path}`;
    }

    async function getSecureUrl(url) {
        if (!url) return '';
        if (imageUrlCache[url]) return imageUrlCache[url]; 
        try {
            const resp = await fetch(url, { headers: ngrokHeaders });
            if (!resp.ok) throw new Error('Network response was not ok');
            const blob = await resp.blob();
            const objectUrl = URL.createObjectURL(blob);
            imageUrlCache[url] = objectUrl; 
            return objectUrl;
        } catch (e) { return ''; }
    }

    async function applyBgImage(element, url) {
        if (!url) { element.classList.add('no-bg'); return; }
        const objectUrl = await getSecureUrl(url);
        if (objectUrl) { element.style.backgroundImage = `url('${objectUrl}')`; element.classList.remove('no-bg'); }
        else { element.classList.add('no-bg'); }
    }

    async function applyImageSrc(imgElement) {
        const url = imgElement.getAttribute('data-src');
        if (!url) return;
        const objectUrl = await getSecureUrl(url);
        if (objectUrl) imgElement.src = objectUrl;
    }

    function showPage(pageId) {
        document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active-page'));
        document.getElementById(pageId).classList.add('active-page');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function goBackToShop() { showPage('mainShopPage'); }

    window.copyWalletLink = function(element, url) {
        event.stopPropagation(); event.preventDefault();
        if (!url || url === '#') { Swal.fire('تنبيه', 'لم يتم تحديد رابط لهذه المحفظة بعد', 'warning'); return; }
        navigator.clipboard.writeText(url).then(() => {
            const originalHTML = element.innerHTML;
            element.innerHTML = '<i class="fas fa-check"></i> تم النسخ';
            element.classList.add('copied');
            setTimeout(() => { element.innerHTML = originalHTML; element.classList.remove('copied'); }, 2000);
        }).catch(err => { Swal.fire('خطأ', 'فشل نسخ الرابط، انسخه يدوياً: ' + url, 'error'); });
    };

    async function loadSettingsAndContacts() {
        try {
            const resp = await fetch(`${API_BASE}/api/settings`, { headers: ngrokHeaders });
            const data = await resp.json(); 
            let html = '';
            if (data.whatsapp) html += `<a href="https://wa.me/${data.whatsapp}"><i class="fab fa-whatsapp" style="color:#25D366"></i> واتساب</a>`;
            if (data.telegram) html += `<a href="https://t.me/${data.telegram}"><i class="fab fa-telegram" style="color:#0088cc"></i> تلغرام</a>`;
            // إضافة زر طلباتي
            html += `<a href="#" onclick="showMyOrders(); return false;"><i class="fas fa-box" style="color:var(--success)"></i> طلباتي</a>`;
            document.getElementById('contactBar').innerHTML = html || '';
            if (data.bot_background) { applyBgImage(document.getElementById('siteBgOverlay'), fixImageUrl(data.bot_background)); }
        } catch(e) {}
    }

    async function showMyOrders() {
        try {
            const resp = await fetch(`${API_BASE}/api/my_orders?buyer_id=${BUYER_ID}`, { headers: ngrokHeaders });
            const orders = await resp.json();
            let htmlContent = '';
            if (orders.length === 0) {
                htmlContent = '<p style="text-align:center; color:var(--text-muted);">لا توجد طلبات سابقة لك.</p>';
            } else {
                orders.forEach(o => {
                    let statusText = ''; let statusClass = '';
                    if(o.status === 'pending') { statusText = '⏳ قيد المراجعة'; statusClass = 'status-pending'; }
                    else if(o.status === 'verified') { statusText = '✅ مكتمل'; statusClass = 'status-verified'; }
                    else if(o.status === 'rejected') { statusText = '❌ مرفوض'; statusClass = 'status-rejected'; }
                    
                    htmlContent += `
                        <div class="order-card">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                                <span style="font-weight:900; color:var(--primary);">#${o.id}</span>
                                <span class="${statusClass}">${statusText}</span>
                            </div>
                            <p style="margin:0; font-weight:700;">${o.product_name} - ${o.variant_name}</p>
                            <p style="margin:0; color:var(--text-muted); font-size:0.9rem;">السعر: ${o.paid_price} ل.س | التاريخ: ${new Date(o.created_at).toLocaleDateString('ar-EG')}</p>
                        </div>`;
                });
            }
            Swal.fire({ title: '📦 طلباتي', html: htmlContent, showConfirmButton: false, showCloseButton: true, width: '500px', background: 'rgba(11,12,21,0.9)', color: '#fff' });
        } catch(e) { Swal.fire('خطأ', 'فشل تحميل الطلبات', 'error'); }
    }

    async function loadAds() {
        try {
            const resp = await fetch(`${API_BASE}/api/ads`, { headers: ngrokHeaders });
            if (!resp.ok) throw new Error('Network response was not ok');
            const ads = await resp.json();
            const container = document.getElementById('adsContainer');
            if (!ads || ads.length === 0) { container.innerHTML = ''; return; }
            let slidesHtml = [];
            for (let ad of ads) {
                const link = ad.link || '#'; const imgStr = ad.images || ''; const content = ad.content || '';
                if (ad.type === 'text_animated' && content) {
                    slidesHtml.push(`<div><a href="${link}" style="text-decoration:none;"><div class="text-ad-banner animated-text"><span>${content}</span></div></a></div>`);
                } else if (ad.type === 'text_static' && content) {
                    slidesHtml.push(`<div><a href="${link}" style="text-decoration:none;"><div class="text-ad-banner"><span>${content}</span></div></a></div>`);
                } else if (ad.type === 'animated' && imgStr) {
                    const images = imgStr.split(',');
                    for (let img of images) { if (!img.trim()) continue; const url = fixImageUrl(img.trim()); slidesHtml.push(`<div><a href="${link}"><img data-src="${url}" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="إعلان"></a></div>`); }
                } else if (ad.type === 'static' && imgStr) {
                    const url = fixImageUrl(imgStr); slidesHtml.push(`<div><a href="${link}"><img data-src="${url}" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="إعلان"></a></div>`);
                }
            }
            if (slidesHtml.length > 0) {
                container.innerHTML = `<div class="ads-slider">${slidesHtml.join('')}</div>`;
                if ($('.ads-slider').hasClass('slick-initialized')) $('.ads-slider').slick('unslick');
                $('.ads-slider').slick({ rtl: true, autoplay: true, autoplaySpeed: 3000, dots: true, fade: true, arrows: false });
                document.querySelectorAll('.ads-slider img[data-src]').forEach(img => applyImageSrc(img));
            } else { container.innerHTML = ''; }
        } catch(e) { console.error("Ad load error:", e); }
    }

    async function loadSections() {
        try {
            const resp = await fetch(`${API_BASE}/api/sections?parent=0`, { headers: ngrokHeaders });
            const sections = await resp.json(); const container = document.getElementById('sectionsContainer');
            let html = '';
            sections.forEach((sec, index) => {
                html += `<div class="col-lg-3 col-md-4 col-sm-6 stagger-item" style="animation-delay: ${index * 0.1}s">
                            <div class="section-card no-bg" id="sec_${sec.id}" onclick="showSection(${sec.id})">
                                <div class="card-bg-overlay"></div>
                                <div class="card-content"><h3>${sec.name}</h3></div>
                            </div></div>`;
            });
            container.innerHTML = html || '<div class="col-12 text-center"><h4>لا توجد أقسام</h4></div>';
            sections.forEach(sec => { const bgUrl = fixImageUrl(sec.image); if (bgUrl) applyBgImage(document.getElementById(`sec_${sec.id}`), bgUrl); });
        } catch(e) { document.getElementById('sectionsContainer').innerHTML = '<div class="col-12 text-danger text-center">فشل الاتصال بالسيرفر</div>'; }
    }

    async function showSection(sectionId) {
        try {
            const resp = await fetch(`${API_BASE}/api/sections/${sectionId}`, { headers: ngrokHeaders });
            if (!resp.ok) throw new Error();
            const data = await resp.json();
            let content = `<div class="text-center mb-4"><h4 style="color:var(--primary); font-weight:900;">${data.section.name}</h4></div><div class="row">`;
            let hasItems = false;
            if (data.subs && data.subs.length > 0) {
                hasItems = true;
                data.subs.forEach((sub, index) => { content += `<div class="col-lg-3 col-md-4 col-sm-6 stagger-item" style="animation-delay: ${index * 0.1}s"><div class="section-card no-bg" id="sub_${sub.id}" onclick="showSection(${sub.id})"><div class="card-bg-overlay"></div><div class="card-content"><h3>${sub.name}</h3></div></div></div>`; });
            }
            if (data.products && data.products.length) {
                hasItems = true;
                data.products.forEach((prod, index) => { content += `<div class="col-lg-3 col-md-4 col-sm-6 stagger-item" style="animation-delay: ${index * 0.1}s"><div class="product-card no-bg" id="prod_${prod.id}" onclick="openDirectCheckout(${prod.id})"><div class="card-bg-overlay"></div><div class="card-content"><h3>${prod.name}</h3><button class="btn-buy" onclick="event.stopPropagation(); openDirectCheckout(${prod.id})"><i class="fas fa-bolt"></i> شراء</button></div></div></div>`; });
            } 
            if (!hasItems) { content += `<div class="col-12"><p class="text-center text-muted">لا توجد منتجات بعد.</p></div>`; }
            content += `</div>`;
            Swal.fire({ html: content, width: '90%', showConfirmButton: false, showCloseButton: true, background: 'rgba(11,12,21,0.9)', backdrop: `rgba(0,0,0,0.8)` });
            if (data.subs) data.subs.forEach(sub => { const bgUrl = fixImageUrl(sub.image); if (bgUrl) applyBgImage(document.getElementById(`sub_${sub.id}`), bgUrl); });
            if (data.products) data.products.forEach(prod => { const pBgUrl = fixImageUrl(prod.background_image || prod.images); if (pBgUrl) applyBgImage(document.getElementById(`prod_${prod.id}`), pBgUrl); });
        } catch(e) { Swal.fire('خطأ', 'فشل التحميل', 'error'); }
    }

    async function openDirectCheckout(productId) {
        Swal.close();
        try {
            const resp = await fetch(`${API_BASE}/api/product/${productId}`, { headers: ngrokHeaders });
            if (!resp.ok) throw new Error();
            const product = await resp.json();
            currentProductData = product; selectedVariantId = null; selectedVariantPrice = 0;
            const shippingResp = await fetch(`${API_BASE}/api/shipping`, { headers: ngrokHeaders });
            const shippingMethods = await shippingResp.json();

            let variantsHtml = '';
            if (product.variants && product.variants.length > 0) {
                product.variants.forEach(v => { 
                    const isDisabled = v.price <= 0;
                    variantsHtml += `<div class="variant-card ${isDisabled ? 'disabled-card' : ''}" onclick="selectVariant(this, ${v.id}, ${v.price})"><div style="font-weight:700;"><i class="fas fa-gem" style="color:var(--primary);"></i> ${v.name}</div><div class="variant-price">${v.price > 0 ? v.price + ' ل.س' : '<span style="color:var(--secondary);">غير متوفر</span>'}</div></div>`; 
                });
            } else { variantsHtml = `<div class="alert alert-warning text-center">غير متوفر</div>`; }

            let shippingHtml = '';
            for (let m of shippingMethods) {
                const walletLink = m.wallet_link || ''; let walletBtnHtml = '';
                if (walletLink) { walletBtnHtml = `<button type="button" class="wallet-link-btn" onclick="copyWalletLink(this, '${walletLink}')"><i class="fas fa-copy"></i> نسخ الرابط</button>`; }
                let qrHtml = '';
                if (m.qr_image) { const qrUrl = fixImageUrl(m.qr_image); qrHtml = `<img data-src="${qrUrl}" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" class="qr-code-img" alt="QR Code">`; }
                shippingHtml += `<div class="payment-method-item" onclick="selectPaymentMethod(this, ${m.id})"><div><i class="fas fa-wallet" style="color:var(--primary);"></i> <strong>${m.name}</strong>${m.note ? `<br><small style="color:var(--text-muted);">${m.note}</small>` : ''}</div><div style="display:flex; align-items:center; gap:10px;">${qrHtml}${walletBtnHtml}</div></div>`;
            }

            const pBgUrl = fixImageUrl(product.background_image || product.images);
            const html = `
                <div class="checkout-product-header no-bg" id="checkout_header_img"><div class="overlay"></div><div class="content"><h2>${product.name}</h2><p style="opacity:0.8;">${product.description || ''}</p></div></div>
                <h4 class="mb-3" style="border-right:4px solid var(--primary); padding-right:15px; font-weight:900;">1. اختر الكمية:</h4>
                ${variantsHtml}
                <div id="checkoutFormSection" style="display:none; opacity:0; transition: opacity 0.5s;">
                    <h4 class="mb-3 mt-5" style="border-right:4px solid var(--success); padding-right:15px; font-weight:900;">2. طريقة الدفع:</h4>
                    <div class="mb-4">${shippingHtml}<input type="hidden" id="selectedShippingId" value=""></div>
                    <h4 class="mb-3 mt-5" style="border-right:4px solid var(--secondary); padding-right:15px; font-weight:900;">3. المعلومات المطلوبة:</h4>
                    <form id="paymentForm">
                        <label class="form-label" style="font-weight:700;">الاسم الكامل *</label>
                        <input type="text" id="buyerName" class="form-control mb-3" required placeholder="أدخل اسمك الكامل">
                        <label class="form-label" style="font-weight:700;">معلومات الحساب / الآي دي *</label>
                        <textarea id="buyerPhone" class="form-control mb-3" required placeholder="أدخل المعلومات المطلوبة مثل: رقم الحساب، آي دي اللعبة، رقم الهاتف..." rows="3"></textarea>
                        <label class="form-label" style="font-weight:700;">رقم العملية (رقم التحويل) *</label>
                        <input type="text" id="transactionNumber" class="form-control" required placeholder="رقم التحويل البنكي">
                        <button type="submit" class="btn-submit-payment"><i class="fas fa-paper-plane"></i> تأكيد الدفع</button>
                    </form>
                </div>`;
            document.getElementById('checkoutContent').innerHTML = html;
            if (pBgUrl) applyBgImage(document.getElementById('checkout_header_img'), pBgUrl);
            document.querySelectorAll('#checkoutContent img[data-src]').forEach(img => applyImageSrc(img));
            showPage('checkoutPage');
            document.getElementById('paymentForm').addEventListener('submit', submitPayment);
        } catch(e) { Swal.fire('خطأ', 'فشل تحميل المنتج', 'error'); }
    }

    window.selectVariant = function(element, vId, vPrice) {
        if (vPrice <= 0) { Swal.fire('غير متوفر', 'هذه الكمية غير متوفرة حالياً', 'warning'); return; }
        selectedVariantId = vId; selectedVariantPrice = vPrice;
        document.querySelectorAll('.variant-card').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        const formSection = document.getElementById('checkoutFormSection');
        formSection.style.display = 'block'; setTimeout(() => formSection.style.opacity = '1', 100);
        formSection.scrollIntoView({ behavior: 'smooth' });
    };

    window.selectPaymentMethod = function(element, mId) {
        document.getElementById('selectedShippingId').value = mId;
        document.querySelectorAll('.payment-method-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
    };

    async function submitPayment(e) {
        e.preventDefault();
        if (!document.getElementById('selectedShippingId').value || !selectedVariantId) { Swal.fire('تنبيه', 'اختر الكمية وطريقة الدفع', 'warning'); return; }
        const data = { 
            product_id: currentProductData.id, variant_id: selectedVariantId, 
            shipping_method_id: parseInt(document.getElementById('selectedShippingId').value), 
            buyer_name: document.getElementById('buyerName').value.trim(), 
            buyer_phone: document.getElementById('buyerPhone').value.trim(), 
            transaction_number: document.getElementById('transactionNumber').value.trim(), 
            paid_price: selectedVariantPrice,
            buyer_id: BUYER_ID // إرسال معرف المستخدم مع الطلب
        };
        const submitBtn = e.target.querySelector('button[type="submit"]'); 
        submitBtn.disabled = true; submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري المعالجة...';
        try {
            const resp = await fetch(`${API_BASE}/api/checkout`, { method: 'POST', headers: { ...ngrokHeaders, 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            const result = await resp.json();
            if (resp.ok) { 
                Swal.fire({ icon: 'success', title: 'تم الاستلام!', text: result.message, background: 'rgba(11,12,21,0.9)', color: '#fff' }).then(() => { goBackToShop(); location.reload(); }); 
            } else { 
                Swal.fire('خطأ', result.error, 'error'); submitBtn.disabled = false; submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> تأكيد الدفع'; 
            }
        } catch(err) { Swal.fire('خطأ', 'خطأ في الاتصال', 'error'); submitBtn.disabled = false; submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> تأكيد الدفع'; }
    }

    window.addEventListener('load', () => { loadSettingsAndContacts(); loadAds(); loadSections(); });
</script>
</body>
</html>
