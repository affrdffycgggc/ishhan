<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishhen</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{--primary:#00e5bf;--primary2:#7c3aed;--bg:#030014;--card:rgba(12,10,30,0.75);--border:rgba(255,255,255,0.07);--danger:#ff3b5c;--text:#e0e0e0}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        header{position:sticky;top:0;z-index:100;padding:16px;text-align:center;border-bottom:1px solid var(--border);background:rgba(3,0,20,0.85)}
        .logo{font-family:'Orbitron';font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .page{display:none;padding:16px;max-width:550px;margin:0 auto 80px}
        .page.active{display:block}
        .glass{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:12px}
        .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
        .btn{width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#000;font-weight:900;font-size:1rem;cursor:pointer;margin-top:8px}
        .btn-sm{width:auto;padding:8px 14px;font-size:.8rem;display:inline-block}
        .cyber-input{width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:#fff;font-family:'Cairo';font-size:.9rem;margin-bottom:10px;outline:none}
        label{display:block;margin-bottom:4px;color:rgba(255,255,255,0.5);font-size:.8rem}
        .cat-card{padding:24px 10px;border-radius:20px;text-align:center;cursor:pointer;border:1px solid var(--border);background:var(--card);min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center}
        .cat-card:hover{transform:translateY(-4px);border-color:var(--primary)}
        .cat-card i{font-size:2rem;margin-bottom:8px}
        .cat-card h3{font-size:.85rem;font-weight:700}
        .pkg-card{padding:14px 16px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;cursor:pointer;border:1px solid var(--border)}
        .pkg-card:hover{border-color:var(--primary);background:rgba(0,229,191,.05)}
        .pkg-card.selected{border-color:var(--primary);border-width:2px;background:rgba(0,229,191,.1)}
        .pkg-price{font-family:'Orbitron';color:var(--primary);font-weight:700}
        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);z-index:999;display:none;justify-content:center;align-items:center;padding:20px}
        .modal-content{background:#1a1a2e;padding:30px;border-radius:24px;max-width:400px;width:100%;text-align:center;border:1px solid var(--primary)}
    </style>
</head>
<body>
    <header><div class="logo" id="main-logo">ISHHEN</div></header>

    <div id="page-home" class="page active">
        <div style="text-align:center;margin-bottom:16px"><h2 style="color:var(--primary)">مرحباً بك</h2></div>
        <div class="grid2" id="categories-grid">
            <div style="text-align:center;padding:30px;color:#888;grid-column:1/-1">
                <i class="fas fa-spinner fa-spin" style="font-size:2rem"></i>
                <p>⏳ جاري تحميل المنتجات...</p>
                <p style="font-size:.7rem;margin-top:5px" id="load-status"></p>
                <button class="btn btn-sm" onclick="loadProducts()" style="margin-top:10px;background:rgba(255,255,255,0.1);color:#fff">🔄 إعادة المحاولة</button>
            </div>
        </div>
    </div>

    <div id="page-products" class="page">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h2 id="products-title" style="color:var(--primary)"></h2>
            <button class="btn btn-sm" onclick="navigate('home')">🔙</button>
        </div>
        <div id="products-list"></div>
    </div>

    <div id="page-plans" class="page">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h2 id="plans-title" style="color:var(--primary)"></h2>
            <button class="btn btn-sm" onclick="navigate('products')">🔙</button>
        </div>
        <div id="plans-list"></div>
    </div>

    <div id="page-checkout" class="page">
        <h2 style="color:var(--primary);margin-bottom:12px">💳 الدفع</h2>
        <div class="glass"><div id="summary-plan" style="font-weight:700"></div><div id="summary-price" style="font-family:'Orbitron';color:var(--primary);font-weight:900;font-size:1.2rem;margin-top:8px"></div></div>
        <div class="glass"><label>👤 الآيدي</label><input type="text" id="player-id" class="cyber-input"><label>🧾 رقم العملية</label><input type="text" id="tx-num" class="cyber-input"></div>
        <div class="glass"><label style="font-weight:700;color:var(--primary)">💳 الدفع</label><div id="payment-methods-list"></div></div>
        <button class="btn" onclick="submitOrder()">🚀 تأكيد</button>
    </div>

    <div id="modal-alert" class="modal">
        <div class="modal-content"><div style="font-size:3rem">🎉</div><p style="margin-bottom:16px" id="modal-msg"></p><button class="btn" onclick="closeModal('modal-alert')">حسناً</button></div>
    </div>

    <script>
    const API_KEY = "SDpoC/9YxijfEyiSz0Tm8zNmWTdlNE1lUkk4SU5iS2c9PQ==";
    let allProducts = [], currentProduct = null, selectedPlan = {}, margin = 20;
    let tapCount = 0, tapTimer = null;

    // استخدام XMLHttpRequest لتجنب مشاكل CORS
    function apiCall(action, extraData, callback) {
        const xhr = new XMLHttpRequest();
        const params = "action=" + action + (extraData ? "&" + new URLSearchParams(extraData).toString() : "");
        
        xhr.open("POST", "https://syristore.com/api.php", true);
        xhr.setRequestHeader("apikey", API_KEY);
        xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
        xhr.timeout = 15000;
        
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    const data = JSON.parse(xhr.responseText);
                    callback(null, data);
                } catch(e) {
                    // إذا فشل JSON، جرب index.php
                    const xhr2 = new XMLHttpRequest();
                    xhr2.open("POST", "https://syristore.com/index.php", true);
                    xhr2.setRequestHeader("apikey", API_KEY);
                    xhr2.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
                    xhr2.onload = function() {
                        if (xhr2.status === 200) {
                            try {
                                callback(null, JSON.parse(xhr2.responseText));
                            } catch(e2) {
                                callback("Invalid JSON response: " + xhr2.responseText.substring(0, 200));
                            }
                        } else {
                            callback("HTTP Error: " + xhr2.status);
                        }
                    };
                    xhr2.onerror = function() { callback("Network Error"); };
                    xhr2.send(params);
                }
            } else {
                callback("HTTP Error: " + xhr.status);
            }
        };
        
        xhr.onerror = function() {
            // جرب index.php
            const xhr2 = new XMLHttpRequest();
            xhr2.open("POST", "https://syristore.com/index.php", true);
            xhr2.setRequestHeader("apikey", API_KEY);
            xhr2.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
            xhr2.onload = function() {
                if (xhr2.status === 200) {
                    try {
                        callback(null, JSON.parse(xhr2.responseText));
                    } catch(e) {
                        callback("Invalid JSON: " + xhr2.responseText.substring(0, 200));
                    }
                } else {
                    callback("HTTP Error: " + xhr2.status);
                }
            };
            xhr2.onerror = function() { callback("Network Error - All attempts failed"); };
            xhr2.send(params);
        };
        
        xhr.send(params);
    }

    function loadProducts() {
        const status = document.getElementById('load-status');
        const grid = document.getElementById('categories-grid');
        
        status.innerText = "⏳ جاري الاتصال بـ SyriaStore...";
        
        apiCall("products", null, function(err, data) {
            if (err) {
                grid.innerHTML = `<div style="text-align:center;color:var(--danger);grid-column:1/-1;padding:20px">
                    <p>❌ ${err}</p>
                    <button class="btn btn-sm" onclick="loadProducts()" style="margin-top:10px">🔄 إعادة المحاولة</button>
                </div>`;
                status.innerText = "❌ فشل: " + err;
                return;
            }
            
            if (!data || !data.products) {
                grid.innerHTML = '<p style="text-align:center;color:#888;grid-column:1/-1">❌ لا توجد منتجات. البيانات: ' + JSON.stringify(data).substring(0, 100) + '</p>';
                status.innerText = "⚠️ لا توجد منتجات";
                return;
            }
            
            const products = data.products;
            status.innerText = `✅ ${products.length} منتج`;
            
            // تصنيف
            const cats = {};
            products.forEach(p => {
                const name = (p.name || "").replace(/SyriaStore|syriastore/gi, "").trim();
                if (!name) return;
                const cat = name.split(" ")[0];
                if (!cats[cat]) cats[cat] = { key: cat, name: getCatName(cat), icon: getIcon(Object.keys(cats).length), color: getColor(Object.keys(cats).length), products: [] };
                
                const plans = (p.plans || []).filter(pl => !pl.disabled).map(pl => ({
                    plan_id: pl.planid || pl.id,
                    name: (pl.name || "").replace(/SyriaStore|syriastore/gi, "").trim(),
                    price: Math.round((pl.price || 0) * (1 + margin / 100))
                }));
                
                if (plans.length) cats[cat].products.push({ name, plans });
            });
            
            window._categories = Object.values(cats).filter(c => c.products.length);
            renderCategories();
        });
    }

    function getCatName(w) {
        const t = {pubg:"🎮 ألعاب",free:"🎮 ألعاب",game:"🎮 ألعاب",whatsapp:"💬 دردشة",telegram:"💬 دردشة",chat:"💬 دردشة",balance:"💰 رصيد",topup:"💰 رصيد",card:"💳 بطاقات",gift:"💳 بطاقات",bitcoin:"₿ عملات",usdt:"₿ عملات",facebook:"📱 سوشل",instagram:"📱 سوشل",number:"📞 أرقام",account:"👤 حسابات",vpn:"🛡️ VPN"};
        for(const[k,v]of Object.entries(t)){if(w.toLowerCase().includes(k))return v}
        return "📦 "+w;
    }
    function getIcon(i){return["fa-fire","fa-comments","fa-gamepad","fa-wallet","fa-bitcoin","fa-credit-card","fa-phone","fa-user-check","fa-share-alt","fa-shield-alt","fa-telegram","fa-star"][i%12]}
    function getColor(i){return["#ff6b6b","#0984e3","#00b894","#fdcb6e","#f39c12","#e17055","#6c5ce7","#00cec9","#e84393","#a29bfe","#74b9ff","#ffd700"][i%12]}

    function renderCategories() {
        const grid = document.getElementById('categories-grid');
        const cats = window._categories || [];
        if (!cats.length) { grid.innerHTML = '<p style="text-align:center;color:#888;grid-column:1/-1">لا توجد فئات</p>'; return; }
        grid.innerHTML = cats.map(c => `<div class="cat-card" onclick="showCat('${c.key}')"><i class="fas ${c.icon}" style="color:${c.color}"></i><h3>${c.name}</h3><small style="color:#888;font-size:.7rem">${c.products.length} منتج</small></div>`).join('');
    }

    function navigate(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + page)?.classList.add('active');
        window.scrollTo({top:0,behavior:'smooth'});
        if (page === 'checkout') loadPM();
    }

    function showCat(key) {
        const cat = (window._categories || []).find(c => c.key === key);
        if (!cat) return;
        document.getElementById('products-title').innerText = cat.name;
        navigate('products');
        allProducts = cat.products;
        document.getElementById('products-list').innerHTML = allProducts.map((p,i) => `<div class="pkg-card glass" onclick="selProd(${i})"><span>📦 ${p.name}</span><span style="color:var(--primary);font-size:.75rem">${p.plans.length} باقة</span></div>`).join('');
    }

    function selProd(i) {
        currentProduct = allProducts[i];
        document.getElementById('plans-title').innerText = currentProduct.name;
        document.getElementById('plans-list').innerHTML = currentProduct.plans.map(p => `<div class="pkg-card glass" onclick="selPlan('${p.plan_id}','${p.name.replace(/'/g,"\\'")}',${p.price})"><span>${p.name}</span><span class="pkg-price">${p.price.toLocaleString()} ل.س</span></div>`).join('');
        navigate('plans');
    }

    function selPlan(id, name, price) {
        selectedPlan = {id, name, price};
        document.getElementById('summary-plan').innerHTML = `🎯 ${name}<br><small style="color:#888">📦 ${currentProduct?.name||''}</small>`;
        document.getElementById('summary-price').innerText = `💰 ${price.toLocaleString()} ل.س`;
        navigate('checkout');
    }

    function loadPM() {
        const m = JSON.parse(localStorage.getItem('pm') || '[{"name":"سيرياتيل كاش","details":"0987654321"}]');
        document.getElementById('payment-methods-list').innerHTML = m.map((x,i) => `<div class="pkg-card" onclick="selPM(${i})" id="pmi-${i}"><span>💳 ${x.name}</span><span style="color:var(--primary);font-size:.8rem">${x.details}</span></div>`).join('');
        setTimeout(()=>document.getElementById('pmi-0')?.classList.add('selected'),100);
    }
    function selPM(i){document.querySelectorAll('#payment-methods-list .pkg-card').forEach(c=>c.classList.remove('selected'));document.getElementById('pmi-'+i)?.classList.add('selected')}

    function submitOrder() {
        const pid = document.getElementById('player-id').value.trim();
        const tx = document.getElementById('tx-num').value.trim();
        if (!pid||!tx) return showAlert('⚠️ املأ الحقول','⚠️');
        localStorage.setItem('pid',pid);
        showAlert('✅ تم استلام الطلب','✅');
        navigate('home');
    }

    function showModal(id){document.getElementById(id).style.display='flex'}
    function closeModal(id){document.getElementById(id).style.display='none'}
    function showAlert(msg,icon){document.getElementById('modal-msg').innerText=msg;showModal('modal-alert')}

    document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
